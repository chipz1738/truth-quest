  $("btnJournal").onclick=()=>{Snd.init();openJournal()};
  $("btnSettings").onclick=()=>{Snd.init();openSettings()};
  $("btnSound").onclick=()=>{Snd.init();const on=S.set.music||S.set.sfx;S.set.music=S.set.sfx=!on;Snd.applyVol();save();UI.refreshHUD()};
  $("prompt").onclick=()=>{if(G.near&&!UI.isOpen())doInteract(G.near)};
  $("btnLeave").onclick=()=>confirmBox("Leave this run?","Your answers so far are saved.","Leave",()=>enterHub());
  $("qbSpeak").onclick=()=>{Snd.init();const st=G.run&&G.run.active;if(st)speak(st.q.q)};
  $("btnAdv").onclick=()=>{Snd.init();openAdventures()};
  $("daily").onclick=()=>toast("Answer 10 questions today to win coins and a free egg! 🥚","gold");
}
function loadFromSave(){
  rollDay();save(true);G.avatar.set(S.wear);makeNameTag();refreshPets();UI.refreshHUD();Snd.applyVol();
  if(G.mode!=="title")enterHub();
}

/* ---------- worlds ---------- */
function placePlayer(s){
  P.x=s.x;P.y=s.y;P.z=s.z;P.vx=P.vy=P.vz=0;P.ground=null;P.face=s.yaw===undefined?0:s.yaw;P.speed=0;
  Cam.yaw=s.yaw===undefined?0:s.yaw;Cam.pitch=.4;Cam.dist=19;camSnap();
  for(const p of G.pets){p.x=P.x;p.y=P.y;p.z=P.z}
}
function enterHub(first){
  const go=()=>{
    if(G.W)G.W.dispose();
    Adv.cleanup();G.run=null;G.W=buildHub();setMode(first?"title":"hub");
    placePlayer(G.W.spawn);$("qbanner").hidden=true;
    Snd.music("hub",0);UI.refreshHUD();
  };
  if(first)go();else withFade(go);
}
function rebuildHubKeepPlayer(){
  if(G.mode!=="hub")return;
  const{x,y,z}=P;G.W.dispose();G.W=buildHub();P.x=x;P.y=y;P.z=z;P.ground=null;
}
function enterRun(id,opts={}){
  const story=opts.story,tower=id==="tower";
  const sec=story?{id:"story-"+story.id,name:story.title,icon:story.icon,theme:story.theme,color:story.color}:tower?{id:0,name:"Tower of Truth",icon:"🗼",theme:"castle",color:"#7e57c2"}:SECTIONS[id-1];
  let nums;
  if(story)nums=story.linked.slice();
  else if(tower)nums=pickRun(QA.filter(q=>getQ(q.n).seen>0).map(q=>q.n),10);
  else{const all=[];for(let i=sec.from;i<=sec.to;i++)all.push(i);nums=pickRun(all,Math.min(8,all.length))}
  withFade(()=>{
    if(G.W)G.W.dispose();
    Adv.cleanup();
    G.W=buildObby(sec,nums,story?{hazard:story.cfg.hazard,finishLabel:story.cfg.hazard==="waves"?"🌅 You made it!":story.cfg.hazard==="storm"?"☀️ Peace!":story.cfg.hazard==="den"?"🌅 Morning!":"🙌 Safe!"}:{});setMode("run");
    G.run={sec,id:story?"story":id,story,nums,stages:G.W.stages,active:null,combo:0,bestCombo:0,misses:0,right:0,total:nums.length,coins:0,xp:0,levelUps:0,falls:0,t0:performance.now(),cp:G.W.spawn,missed:[],mastered0:totals().mastered,done:false};
    placePlayer(G.W.spawn);$("qbanner").hidden=true;$("qbCombo").textContent="";
    Snd.music("run",((tower?5:story?STORIES.indexOf(story):id)*2)%7-3);
    toast(sec.icon+" "+sec.name,"gold",2600);
    setTimeout(()=>toast(story?story.goal:"Run forward and jump across the gaps! 🦘"),700);
  });
}
function respawn(){
  const cp=G.run?G.run.cp:(Adv.cp||G.W.spawn);if(G.run)G.run.falls=(G.run.falls||0)+1;
  Part.burst(P.x,P.y+2,P.z,["#ffffff","#bfe6ff"],14,10,.6,18,.8);
  P.x=cp.x;P.y=(cp.y||0)+.1;P.z=cp.z;P.vx=P.vy=P.vz=0;P.ground=null;
  Part.burst(P.x,P.y+2,P.z,["#ffffff","#ffd43b"],18,12,.7,18,.8);Snd.sfx("whoosh");
  for(const p of G.pets){p.x=P.x;p.y=P.y;p.z=P.z}
  Cam.tx=P.x;Cam.tz=P.z;Cam.ty=P.y+3.4;
}

/* ---------- interactions ---------- */
function nearestInteract(){
  let best=null,bd=1e9;
  for(const it of G.W.interacts){
    if(it.st&&it.st.cleared&&it.key!=="finish")continue;
    if(it.when&&!it.when())continue;
    if(it.key==="finish"&&!(G.run&&G.run.stages.every(s=>s.cleared)))continue;
    const d=Math.hypot(P.x-it.x,P.z-it.z);
    if(d<it.r&&d<bd){best=it;bd=d}
  }
  return best;
}
function doInteract(it){
  Snd.init();
  if(it.fn){it.fn();return}
  switch(it.key){
    case"adv":openAdventures();break;
    case"sec":openWorld(it.sec);break;
    case"tower":openTower();break;
    case"ark":openArk();break;
    case"closet":openCloset();break;
    case"library":openJournal();break;
    case"chest":claimDaily();break;
    case"guide":openGuide();break;
    case"scroll":openLearn(it.st);break;
    case"totem":openPuzzleFor(it.st);break;
    case"finish":completeRun();break;
  }
}
function openPuzzleFor(st){
  if(st.cleared){toast("Already solved! ✔");return}
  openPuzzle(st,res=>answerPuzzle(st,res));
}

/* ---------- answers & rewards ---------- */
/* the banner shows only the question: the answers are on the lettered pads */
function setActive(st){
  const r=G.run;if(r.active===st)return;r.active=st;
  const b=$("qbanner");
  if(!st){b.hidden=true;placePrompt();return}
  b.hidden=false;$("qbNum").textContent="Question "+(st.i+1)+" of "+r.total;$("qbText").textContent=st.q.q;
  const h=$("qbHint");h.className="";h.textContent=st.plan.mode==="mc"?"🦘 Jump onto the pad with the right answer!":"🧩 Walk to the glowing totem and solve the puzzle!";
  $("qbCombo").textContent=r.combo>1?"🔥 Combo x"+r.combo:"";
  $("qbOpts").innerHTML="";
  if(S.set.voice)speak(st.q.q);
}
function onPad(pd){
  const st=pd.st;if(st.cleared)return;
  const p=st.pads[pd.k];if(p.state!=="idle")return;
  if(p.ok){G.W.revealCorrect(st,pd.k);answerRight(st)}
  else{G.W.crumble(st,pd.k);answerWrong(st)}
}
function answerWrong(st,silent){
  const r=G.run,w=writeQ(st.n);
  if(!st.missed){
    st.missed=true;if(!st.counted){st.counted=true;w.seen++;S.stats.answers++}
    w.miss++;if(w.lv>0)w.lv--;r.combo=0;r.misses++;r.missed.push(st.n);
  }
  if(!silent){popText("Not quite!","bad");Snd.sfx("bad")}
  const h=$("qbHint");h.className="learn";h.textContent="✅ The answer: "+st.q.a;$("qbCombo").textContent="";
  if(S.set.voice)speak("The answer is: "+st.q.a);
  save();
}
function answerRight(st){
  if(st.cleared)return;st.cleared=true;
  const r=G.run,w=writeQ(st.n),first=!st.missed;
  if(!st.counted){st.counted=true;w.seen++;S.stats.answers++}
  let coins,xp;
  if(first){
    w.ok++;w.lv=Math.min(4,w.lv+1);r.combo++;r.bestCombo=Math.max(r.bestCombo,r.combo);r.right++;S.stats.right++;S.stats.bestCombo=Math.max(S.stats.bestCombo,r.combo);
    coins=Math.round((10+2*Math.min(r.combo-1,8))*(1+petBonus()));xp=12;
  }else{coins=Math.round(3*(1+petBonus()));xp=4}
  S.coins+=coins;r.coins+=coins;r.xp+=xp;S.daily.n++;
  const ups=addXP(xp);r.levelUps+=ups;
  popText(first?(r.combo>=3?"Combo x"+r.combo+"!":"Correct!"):"You got it!");
  toast("+"+coins+" 🪙   +"+xp+" XP","good",1800);
  Snd.sfx("good");G.avatar.cheer=1.2;Part.confetti(P.x,P.y,P.z,first?60:30);
  $("qbCombo").textContent=r.combo>1?"🔥 Combo x"+r.combo:"";
  {const h=$("qbHint");h.className="learn";h.textContent="✅ "+st.q.a}
  if(ups)setTimeout(()=>levelUpFx(ups),900);
  dailyCheck();
  checkBadges().forEach((b,i)=>setTimeout(()=>{toast("🏅 Badge unlocked: "+b.name,"gold",3600);Snd.sfx("level")},1300+i*400));
  UI.refreshHUD();save();
}
function answerPuzzle(st,res){
  if(st.cleared)return;
  if(res.misses>res.allow)answerWrong(st,true);
  G.W.openBridge(st);answerRight(st);
}
function levelUpFx(n){popText("LEVEL UP!");toast("⭐ Level "+S.lv+"! You earned a free egg 🥚","gold",4000);Snd.sfx("level");Part.confetti(P.x,P.y,P.z,80)}
function dailyCheck(){
  const d=S.daily;
  if(!d.claimed&&d.n>=10){d.claimed=true;S.eggs++;S.coins+=30;setTimeout(()=>{toast("⭐ Daily quest complete! +30 🪙 and a free egg 🥚","gold",4800);Snd.sfx("level")},1000)}
}

function completeRun(){
  const r=G.run;if(!r||r.done)return;
  if(!r.stages.every(s=>s.cleared)){toast("Answer every question first!");return}
  r.done=true;
  if(r.story){G.W.openChest();Part.confetti(G.W.chest.x,3,G.W.chest.z,120);UI.refreshHUD();save(true);Adv.completeObby(r);return}
  const time=(performance.now()-r.t0)/1000,acc=r.right/r.total,stars=acc>=.9?3:acc>=.6?2:1;
  const bonus=Math.round((25+stars*10)*(1+petBonus())),xpB=20+stars*5;
  r.coins+=bonus;r.xp+=xpB;S.coins+=bonus;r.levelUps+=addXP(xpB);
  S.stats.runs++;if(r.misses===0&&r.total>=5)S.stats.perfect++;
  if(r.id!=="tower"){const b=S.stats.bestTime[r.id];if(r.misses<=1&&(!b||time<b))S.stats.bestTime[r.id]=Math.round(time)}
  const badges=checkBadges();
  G.W.openChest();Part.confetti(G.W.chest.x,3,G.W.chest.z,120);Snd.sfx("reveal");G.avatar.cheer=2;
  UI.refreshHUD();save(true);
  setTimeout(()=>openResults({sec:r.sec,again:r.id,stars,right:r.right,total:r.total,coins:r.coins,xp:r.xp,bestCombo:r.bestCombo,time,levelUps:r.levelUps,missed:r.missed,badges,newMastered:totals().mastered-r.mastered0}),1500);
}

/* ---------- per-frame ---------- */
function groundBelow(){
  let best=G.W.killY;
  for(const s of G.W.solids){
    if(!s.on||s.y1>P.y+.7)continue;
    if(s.kind==="cyl"){const dx=P.x-s.cx,dz=P.z-s.cz;if(dx*dx+dz*dz>s.r*s.r)continue}
    else if(P.x<s.x0||P.x>s.x1||P.z<s.z0||P.z>s.z1)continue;
    if(s.y1>best)best=s.y1;
  }
  return best;
}
function updatePets(dt){
  const n=G.pets.length,moving=P.speed>2;
  G.pets.forEach((p,i)=>{
    const off=(i-(n-1)/2)*3.8,back=-4.4,s=Math.sin(P.face),c=Math.cos(P.face);
    const tx=P.x+s*back+c*off,tz=P.z+c*back-s*off,k=1-Math.exp(-6*dt);
    const dx=tx-p.x,dz=tz-p.z;p.x+=dx*k;p.z+=dz*k;p.y+=(P.y-p.y)*(1-Math.exp(-9*dt));
    if(Math.hypot(dx,dz)>.35){let d=Math.atan2(dx,dz)-p.face;d=Math.atan2(Math.sin(d),Math.cos(d));p.face+=d*Math.min(1,dt*10)}
    else{let d=P.face-p.face;d=Math.atan2(Math.sin(d),Math.cos(d));p.face+=d*Math.min(1,dt*4)}
    const hop=moving?Math.abs(Math.sin(G.t*9+i*1.7))*.7:Math.sin(G.t*2.5+i)*.15;
    p.g.position.set(p.x,p.y+.15+hop,p.z);p.g.rotation.y=p.face;
    const fl=p.g.userData.flaps;if(fl)for(const f of fl)f.rotation.z=f.userData.flap*Math.sin(G.t*(moving?16:7)+i)*.55;
  });
}
function collectCoins(){
  for(const c of G.W.coins){
    if(c.got)continue;
    if(Math.abs(P.x-c.x)<3.4&&Math.abs(P.z-c.z)<3.4&&Math.abs(P.y+2.6-c.y)<4.6){
      c.got=true;S.coins++;if(G.run)G.run.coins++;
      Snd.sfx("coin");Part.burst(c.x,c.y,c.z,["#ffcf24","#fff3a0"],6,7,.5,12,.7);UI.refreshHUD();save();
    }
  }
}
function placePrompt(){const b=$("qbanner"),pr=$("prompt");pr.style.bottom=(!b.hidden&&!Input.touch&&G.mode==="run")?(b.offsetHeight+34)+"px":""}
function updatePrompt(){
  const it=nearestInteract();G.near=it;
  const key=it?it.key+(it.sec||"")+(it.st?it.st.i:""):"";
  const pr=$("prompt");
  if(key!==G.nearKey){
    G.nearKey=key;
    if(it){pr.hidden=false;pr.innerHTML=(Input.touch?"":'<span class="k">E</span> ')+it.icon+" "+it.label;placePrompt()}else pr.hidden=true;
  }
  if(Input.actQ){Input.actQ=false;if(it)doInteract(it)}
}
function runLogic(){
  const r=G.run;
  if(P.ground&&P.ground.cp)r.cp=P.ground.cp;
  let active=null;
  for(const st of r.stages){if(!st.cleared){if(P.z>st.zNear0-12)active=st;break}}
  setActive(active);
  if(active&&P.ground===active.near){
    if(!active.learnShown&&active.plan.learn){active.learnShown=true;openLearn(active)}
    else if(active.totem&&!active.puzzleOpened&&Math.hypot(P.x-active.totem.x,P.z-active.totem.z)<11){active.puzzleOpened=true;openPuzzleFor(active)}
  }
  if(P.ground&&P.ground.pad)onPad(P.ground.pad);
  for(const h of G.W.hazards)if(h.isOn&&Math.abs(P.x-h.x)<h.r&&Math.abs(P.z-h.z)<h.r&&P.y<h.y+5.5){r.burn=(r.burn||0);if(performance.now()-r.burn>900){r.burn=performance.now();toast("Ouch! Wait for the fire to die down. 🔥","bad",1600);Snd.sfx("bad");flash("red",160);respawn()}}
}
const _q=new THREE.Vector3();
function updateQuest(){
  const q=$("quest"),Q=G.W&&G.W.quest;
  if((G.mode!=="hub"&&G.mode!=="adv")||!Q||UI.isOpen()||G.frozen){q.hidden=true;return}
  const dist=Math.hypot(P.x-Q.pos.x,P.z-Q.pos.z);
  if(dist<16){q.hidden=true;return}
  q.hidden=false;
  const w=appEl.clientWidth,h=appEl.clientHeight;
  _q.copy(Q.pos).project(camera);
  let nx=_q.x,ny=_q.y;if(_q.z>1){nx=-nx;ny=-ny}
  let sx=(nx*.5+.5)*w,sy=(-ny*.5+.5)*h;
  const ok=_q.z<=1&&sx>70&&sx<w-70&&sy>110&&sy<h-110,arrow=q.firstChild;
  if(!ok){
    const cx=w/2,cy=h/2;let dx=sx-cx,dy=sy-cy;if(Math.abs(dx)<1&&Math.abs(dy)<1)dy=-1;
    const k=Math.min((w/2-70)/Math.abs(dx||1e-6),(h/2-120)/Math.abs(dy||1e-6));
    sx=cx+dx*k;sy=cy+dy*k;arrow.style.transform="rotate("+(Math.atan2(dy,dx)-Math.PI/2)*180/Math.PI+"deg)";arrow.style.animation="none";
  }else{arrow.style.transform="";arrow.style.animation=""}
  const txt=(Q.label||(S.stats.runs===0?"Start here!":"Next: "+Q.sec.name))+"  "+Math.round(dist/3)+" m";
  if(q.lastChild.textContent!==txt)q.lastChild.textContent=txt;
  q.style.transform="translate("+Math.round(sx)+"px,"+Math.round(sy)+"px) translate(-50%,-50%)";
}
function walkStep(dt){
  const W=G.W,mv=moveVec(),jp=Input.jumpQ;Input.jumpQ=false;
  const n=Math.max(1,Math.ceil(dt/.0167)),h=dt/n;
  for(let i=0;i<n;i++)physicsStep(h,mv.x,mv.z,i===0&&jp,Input.jumpHeld,W.solids);
  if(P.speed>1.5){let d=Math.atan2(P.vx,P.vz)-P.face;d=Math.atan2(Math.sin(d),Math.cos(d));P.face+=d*Math.min(1,dt*15)}
  if(P.y<W.killY)respawn();
  collectCoins();
}
function update(dt){
  G.t+=dt;G.camDone=false;
  const W=G.W;if(!W)return;
  if(UI.tick)UI.tick(dt);
  W.update(dt,G.t);
  if(G.mode==="title"){
    Cam.yaw+=dt*.06;Cam.pitch=.3;Cam.dist=112;Cam.tx=0;Cam.ty=10;Cam.tz=-8;camPlace();
    G.avatar.animate(dt,0,true,0);G.avatar.root.position.set(P.x,P.y,P.z);G.avatar.root.rotation.y=P.face;
    G.shadow.position.set(P.x,.05,P.z);if(G.tag)G.tag.visible=false;Part.update(dt);$("quest").hidden=true;return;
  }
  if(G.tag)G.tag.visible=G.mode=="hub"; /* the floating name hides the answer signs in runs */
  const paused=UI.isOpen()||G.frozen;
  if(G.mode==="adv"){
    Adv.update(dt,paused);
    if(!paused&&!UI.isOpen())updatePrompt();else if(UI.isOpen()){$("prompt").hidden=true;G.nearKey=""}
  }else if(!paused){
    walkStep(dt);
    if(G.run)runLogic();
    if(!UI.isOpen())updatePrompt();
  }else{
    Input.jumpQ=false;Input.actQ=false;P.vx=P.vz=0;P.speed=0;
    if(UI.isOpen()){$("prompt").hidden=true;G.nearKey=""}
  }
  const av=G.avatar;
  av.root.position.set(P.x,P.y,P.z);av.root.rotation.y=P.face;av.animate(dt,P.speed,!!P.ground,P.vy);
  if(G.tag)G.tag.position.set(P.x,P.y+7.7,P.z);
  const gy=groundBelow(),hgt=Math.max(0,P.y-gy),sc=Math.max(.35,1-hgt/24);
  G.shadow.position.set(P.x,gy+.05,P.z);G.shadow.scale.set(sc,sc,1);G.shadow.material.opacity=.3*sc;
  updatePets(dt);Part.update(dt);
  Cam.shake*=Math.pow(.04,dt);
  if(G.camCustom)G.camCustom(dt);else if(!G.camDone)camUpdate(dt);
  updateQuest();
}
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,Math.max(.001,(now-G.last)/1000));G.last=now;
  try{update(dt)}catch(e){console.error(e)}
  renderer.render(scene,camera);
}

window.__CQ={get S(){return S},P,G,Cam,Input,Adv,STORIES,enterAdventure,enterRun,enterHub,answerRight,answerWrong,completeRun,openCloset,openArk,openJournal,openSettings,openWorld,openTower,openGuide,claimDaily,openTutorial,openLearn,openPuzzle,openAdventures,openStoryIntro,get W(){return G.W}};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
</script>
