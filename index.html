<title>Truth Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one full-screen 3D stage; HUD floats on top; panels float above that. Single bright game look by design. */
:root{
  --bg:#8fd0ff;--ink:#241f45;--paper:#fffdf5;--panel:#ffffff;--muted:#6a6590;
  --sun:#ffc531;--sun-d:#d99a00;--sky:#3aa0ff;--sky-d:#1677d6;--grass:#2fd37a;--grass-d:#16a35a;
  --berry:#ff5a8a;--berry-d:#d63a69;--violet:#7a5cff;--violet-d:#5638d6;--bad:#ff5a5a;--soft:#f1ecff;
  --shade:rgba(20,14,60,.4);
  --display:"Lilita One","Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:var(--bg)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid #fff;outline-offset:2px;box-shadow:0 0 0 7px var(--violet)}
[hidden]{display:none!important}

/* ---------- buttons & pills ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:20px;letter-spacing:.2px;padding:10px 22px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;touch-action:manipulation}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.green{background:var(--grass)}.btn.blue{background:var(--sky);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}.btn.pink{background:var(--berry);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}.btn.violet{background:var(--violet);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}.btn.white{background:#fff}
.btn.big{font-size:28px;padding:14px 34px;border-radius:18px;box-shadow:0 7px 0 var(--ink)}
.btn.small{font-size:16px;padding:6px 14px;border-radius:12px;box-shadow:0 4px 0 var(--ink)}
.btn[disabled]{filter:grayscale(.85) brightness(1.05);opacity:.7;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 8px;font-family:var(--display);font-size:20px;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.rbtn{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:22px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;touch-action:manipulation}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#hud button,#hud .pointy{pointer-events:auto}
#topLeft{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:8px;max-width:46%}
#pcard{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:5px 12px 5px 5px;box-shadow:0 4px 0 var(--ink)}
#pLv{width:42px;height:42px;border-radius:12px;background:var(--violet);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:20px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.3);flex:none}
#pInfo{min-width:90px;display:flex;flex-direction:column;gap:3px}
#pName{font-family:var(--display);font-size:17px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.bar{height:11px;background:#e7e3f7;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(var(--sun),#ffa800);transition:width .4s}
#daily{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px 8px;box-shadow:0 4px 0 var(--ink);font-size:13px;line-height:1.15;max-width:230px;pointer-events:auto;cursor:pointer}
#daily b{font-family:var(--display);font-weight:400;font-size:14px;display:block;margin-bottom:4px}
#daily .bar>i{background:linear-gradient(#5be39a,var(--grass))}
#topRight{position:absolute;right:10px;top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
#qbanner{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100% - 20px));background:rgba(255,255,255,.95);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:6px 44px 8px;text-align:center}
#qbanner .qb-head{display:flex;justify-content:center;gap:10px;align-items:center;font-family:var(--display);font-size:15px;color:var(--muted);margin-bottom:2px}
#qbanner .qb-chip{background:var(--violet);color:#fff;border-radius:99px;padding:1px 12px;border:2px solid var(--ink)}
#qbText{font-size:clamp(17px,2.4vw,26px);font-weight:900;line-height:1.15}
#qbHint{font-size:14px;color:var(--muted);margin-top:3px;font-weight:800}
#qbHint.learn{color:#0d7a43;background:#dcfbe9;border-radius:10px;padding:4px 8px;font-size:15px}
#qbOpts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;text-align:left}
#qbOpts:empty{display:none}
.opt{display:flex;gap:8px;align-items:flex-start;background:#f6f3ff;border:2px solid var(--ink);border-radius:12px;padding:5px 8px;font-size:14.5px;font-weight:800;line-height:1.2}
.opt b{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:400;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.opt.x{opacity:.38;text-decoration:line-through}.opt.ok{background:#dcfbe9;border-color:#1c9e5d}
#qbSpeak{position:absolute;right:-8px;top:-8px;width:38px;height:38px;font-size:18px}
#prompt{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:92%}
#prompt .k{background:var(--ink);color:#fff;border-radius:8px;padding:0 8px;font-size:16px;font-family:var(--body);font-weight:900}
#quest{position:absolute;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:0;font-family:var(--display);color:#fff;text-shadow:0 2px 0 var(--ink);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;will-change:transform}
#quest i{font-style:normal;font-size:46px;line-height:.9;color:var(--sun);animation:qbob .8s ease-in-out infinite;display:block}
#quest b{font-weight:400;font-size:17px;background:var(--violet);border:3px solid var(--ink);border-radius:99px;padding:1px 12px;white-space:nowrap;-webkit-text-stroke:0;text-shadow:0 2px 0 rgba(0,0,0,.35)}
@keyframes qbob{50%{transform:translateY(7px)}}
#toasts{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,92%)}
.toast{background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:7px 14px;font-weight:900;font-size:16px;text-align:center;animation:tin .25s ease-out;line-height:1.2}
.toast.good{background:#dcfbe9}.toast.bad{background:#ffe3e3}.toast.gold{background:#fff1bf}.toast.learn{background:#dcfbe9;font-size:18px}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{transform:translateY(-10px) scale(.9);opacity:0}}
#pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(34px,7vw,64px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);pointer-events:none;opacity:0;white-space:nowrap}
#pop.go{animation:pop 1.15s ease-out}
#pop.bad{color:#ffd0d0}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
#fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s;z-index:25}
#fade.on{opacity:1}
body:not(.mode-run):not(.mode-adv) .only-run,body.mode-run .only-hub,body.mode-adv .only-hub,body.mode-title #hud{display:none}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(36,31,69,.55);display:none;pointer-events:none}
#joy.on{display:block}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.85);border:3px solid var(--ink);transform:translate(-50%,-50%)}
#jumpBtn{position:absolute;right:max(22px,env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:50%;border:4px solid var(--ink);background:var(--sun);font-family:var(--display);font-size:20px;box-shadow:0 6px 0 var(--ink);display:none;pointer-events:auto;touch-action:none}
#jumpBtn.down{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);filter:brightness(1.1)}
body.touch #jumpBtn{display:block}
body.touch #qbanner{top:var(--hudTop,68px);bottom:auto}
body.mode-adv #qbanner{top:var(--hudTop,64px);bottom:auto}body.mode-adv #qbOpts{grid-template-columns:repeat(3,1fr)}body.mode-adv #qbanner{width:min(720px,calc(100% - 20px))}body.gateq #advbar{display:none}
body.mode-adv #hud #qbanner,body.touch #hud #qbanner{pointer-events:none}body.mode-adv #hud #qbSpeak,body.touch #hud #qbSpeak{pointer-events:auto}
body.mode-run:not(.touch) #toasts{bottom:auto;top:70px}
body.touch #prompt{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
body.touch #pcard #pName{max-width:90px}

/* ---------- modals ---------- */
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(28,20,78,.55);padding:10px;z-index:30;touch-action:pan-y}
#modal.on{display:flex}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink),0 24px 50px var(--shade);width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:pin .22s ease-out}
.panel.narrow{width:min(520px,100%)}.panel.wide{width:min(980px,100%)}
@keyframes pin{from{transform:translateY(16px) scale(.94);opacity:0}}
.panel-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;background:var(--hc,var(--sky));border-bottom:4px solid var(--ink);color:#fff;font-family:var(--display);font-size:clamp(20px,3.4vw,28px);text-shadow:0 2px 0 rgba(0,0,0,.35);line-height:1.1}
.panel-head .t{flex:1;min-width:0}
.panel-body{padding:16px 18px;overflow:auto;flex:1;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
.panel-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:12px 16px;border-top:4px solid var(--ink);background:var(--soft)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.center{text-align:center}
h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 6px}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 14px}
.verse{background:#fff8dc;border:3px dashed #c99a00;border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;line-height:1.35}
.verse b{display:block;font-family:var(--display);font-weight:400;color:#8a5f00;margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:3px solid var(--ink);background:#fff;border-radius:12px;padding:5px 11px;font-family:var(--display);font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tab.on{background:var(--violet);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.stat{display:flex;flex-direction:column;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;min-width:84px}
.stat b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}.stat span{font-size:12px;color:var(--muted)}

/* world select */
.lvbar{display:flex;height:22px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:#eee}
.lvbar i{display:block;height:100%}
.qdots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.qdots span{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink);font-size:10px;display:grid;place-items:center;font-weight:900;color:#fff}
.lv0{background:#b9b4d6}.lv1{background:#ffb347}.lv2{background:#ffd93d;color:var(--ink)!important}.lv3{background:#7be0a0;color:var(--ink)!important}.lv4{background:#2fd37a}

/* learn + puzzle */
.big-q{font-size:clamp(22px,4vw,34px);font-weight:900;line-height:1.15}
.big-a{font-size:clamp(20px,3.6vw,30px);font-weight:900;line-height:1.25;color:#0d7a43;background:#dcfbe9;border:3px solid #1c9e5d;border-radius:16px;padding:12px 16px;margin-top:12px}
.sentence{font-size:clamp(20px,3.4vw,30px);font-weight:900;line-height:2.1;margin:12px 0}
.blank{user-select:none;-webkit-user-select:none;display:inline-block;min-width:78px;padding:0 10px;margin:0 2px;border-bottom:5px solid var(--ink);background:#fff3c4;border-radius:8px 8px 0 0;text-align:center;color:transparent}
.blank.cur{background:#ffe27a;animation:blink 1s infinite}
.blank.done{color:#0d7a43;background:#dcfbe9;border-color:#1c9e5d;animation:none}
@keyframes blink{50%{background:#fff3c4}}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0 4px}
.chip{font-family:var(--display);font-size:clamp(17px,2.8vw,24px);padding:8px 16px;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:manipulation;transition:transform .08s,box-shadow .08s}
.chip:nth-child(4n+1){background:#ffe3ea}.chip:nth-child(4n+2){background:#dff0ff}.chip:nth-child(4n+3){background:#e6fbd9}.chip:nth-child(4n){background:#fff1bf}
.chip:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.chip.used{visibility:hidden}.chip.bad{animation:shake .35s;background:#ffb3b3!important}
.chip.hint{outline:5px solid var(--grass);outline-offset:2px;animation:blink2 .8s infinite}
@keyframes blink2{50%{outline-color:transparent}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.built{min-height:76px;display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#fff;border:3px dashed var(--ink);border-radius:16px;align-items:center}
.built .chip{cursor:default;background:#dcfbe9!important;animation:place .2s}
.built .ph{color:#b3aed1;font-size:18px}
@keyframes place{from{transform:scale(.7)}}
.meter{font-size:14px;color:var(--muted);text-align:center;margin-top:6px}

/* journal */
.qcard{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.qcard .qn{font-family:var(--display);font-size:16px;background:var(--violet);color:#fff;border-radius:10px;padding:4px 8px;border:2px solid var(--ink);min-width:44px;text-align:center}
.qcard .qt{font-weight:900;font-size:16px;line-height:1.2}.qcard .qa{font-weight:700;color:#0d7a43;font-size:15px;line-height:1.25;margin-top:2px}
.pips{display:flex;gap:3px;justify-content:flex-end}.pips i{width:12px;height:12px;border-radius:4px;border:2px solid var(--ink);background:#e7e3f7}.pips i.on{background:var(--grass)}
.search{width:100%;box-sizing:border-box;font:inherit;font-weight:800;font-size:17px;padding:9px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;margin-bottom:10px}
.badge{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px}
.badge .ic{font-size:30px;filter:grayscale(1) opacity(.35)}.badge.on .ic{filter:none}.badge.on{background:#fff6cf}
.badge b{font-family:var(--display);font-weight:400;font-size:16px;display:block}.badge span{font-size:13px;color:var(--muted);line-height:1.2;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid.badges{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

/* ark */
.egg{width:132px;height:166px;margin:6px auto 14px;position:relative;background:radial-gradient(circle at 34% 26%,#fff 0 7%,transparent 8%),radial-gradient(circle at 70% 62%,#ff8fb0 0 9%,transparent 10%),radial-gradient(circle at 32% 70%,#6bc4ff 0 8%,transparent 9%),linear-gradient(#fff3d1,#ffd18a);border:4px solid var(--ink);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;box-shadow:0 7px 0 var(--ink)}
.egg.shake{animation:wobble .5s infinite}
.egg.crack::after{content:"";position:absolute;left:18%;right:18%;top:42%;height:6px;background:var(--ink);clip-path:polygon(0 50%,15% 0,30% 100%,48% 10%,65% 100%,82% 0,100% 50%,82% 100%,65% 30%,48% 100%,30% 30%,15% 100%)}
.egg.boom{animation:boom .4s forwards}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-13deg)}40%{transform:rotate(11deg)}60%{transform:rotate(-9deg)}80%{transform:rotate(7deg)}}
@keyframes boom{to{transform:scale(2.2);opacity:0}}
.reveal{text-align:center;animation:rev .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes rev{from{transform:scale(.2);opacity:0}}
.reveal img{width:190px;height:190px;image-rendering:auto}
.rar{display:inline-block;color:#fff;border:3px solid var(--ink);border-radius:99px;padding:1px 14px;font-family:var(--display);font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.petcard{position:relative;background:#fff;border:3px solid var(--rc,var(--ink));border-radius:16px;padding:6px 6px 8px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);outline:2px solid var(--ink)}
.petcard img{width:84px;height:84px;display:block;margin:0 auto}
.petcard.locked img{filter:brightness(0) opacity(.2)}
.petcard b{font-family:var(--display);font-weight:400;font-size:16px;display:block}
.petcard small{font-size:12px;color:var(--muted);font-weight:800}
.petcard .eq{position:absolute;top:-8px;right:-6px;background:var(--grass);color:#fff;border:3px solid var(--ink);border-radius:99px;font-size:12px;padding:0 8px;font-family:var(--display)}
.petcard .cnt{position:absolute;top:2px;left:6px;font-size:12px;font-weight:900;color:var(--muted)}

/* closet */
.closet{display:grid;grid-template-columns:230px 1fr;gap:14px;min-height:0}
.preview{background:linear-gradient(#bfe6ff,#eaf7ff);border:3px solid var(--ink);border-radius:16px;display:grid;place-items:center;height:300px;overflow:hidden;position:relative}
.preview canvas{width:100%;height:100%;display:block}
.item{position:relative;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:92px;touch-action:manipulation}
.item .ic{font-size:34px;line-height:1.1;height:40px;display:grid;place-items:center}
.item .sw{width:38px;height:38px;border-radius:10px;border:3px solid var(--ink)}
.item b{font-size:12px;line-height:1.1;font-weight:900}
.item small{font-size:12px;font-weight:900;color:var(--muted)}
.item.on{background:#dcfbe9;border-color:#1c9e5d}.item.lock{opacity:.7;background:#ece9f7}
.item:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* results */
.stars{font-size:54px;letter-spacing:6px;text-align:center;line-height:1}
.stars .off{filter:grayscale(1) opacity(.3)}
.stars span{display:inline-block;animation:starIn .5s both}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.miss{background:#fff0f0;border:3px solid var(--bad);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:15px;line-height:1.25}
.miss b{display:block}.miss span{color:#0d7a43;font-weight:800}

/* title */
#title{position:absolute;inset:0;z-index:40;display:flex;align-items:safe center;justify-content:center;padding:14px;overflow:auto;box-sizing:border-box;background:linear-gradient(rgba(20,14,70,.1),rgba(20,14,70,.45))}
.tcard{margin:auto;width:min(640px,100%);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.logo{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;font-family:var(--display);font-size:clamp(42px,9vw,86px);line-height:1}
.logo span{display:inline-block;padding:2px 10px 6px;border:4px solid var(--ink);border-radius:14px;color:#fff;box-shadow:0 7px 0 var(--ink);text-shadow:0 4px 0 rgba(0,0,0,.3);animation:bob 2.4s ease-in-out infinite}
.logo .gap{width:100%;height:0;padding:0;border:0;box-shadow:none;animation:none}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.tag{font-family:var(--display);font-size:clamp(17px,3vw,24px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);letter-spacing:.3px}
.picker{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.pgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-height:56vh;overflow:auto;padding:6px 8px 10px;width:100%;box-sizing:border-box;touch-action:pan-y}
.pcardx{width:128px;box-sizing:border-box;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;touch-action:manipulation}
.pcardx:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.pcardx.last{background:#fff6cf}
.pcardx b{font-family:var(--display);font-weight:400;font-size:19px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcardx small{font-size:12px;color:var(--muted);font-weight:800}
.pcardx.new{justify-content:center;background:#dff0ff;min-height:128px}
.pcardx.new b{font-size:16px;white-space:normal;text-align:center;line-height:1.05}
.pcardx .plus{font-family:var(--display);font-size:46px;line-height:1;color:var(--sky-d)}
.pface{width:46px;height:56px;display:flex;flex-direction:column;align-items:center}
.pface .h{width:30px;height:30px;background:var(--skin);border:3px solid var(--ink);border-radius:8px;display:block;position:relative}
.pface .h::before,.pface .h::after{content:"";position:absolute;top:10px;width:4px;height:7px;background:var(--ink);border-radius:2px}
.pface .h::before{left:6px}.pface .h::after{right:6px}
.pface .b{width:44px;height:22px;background:var(--shirt);border:3px solid var(--ink);border-radius:6px;margin-top:-2px;display:block}
.err{color:#b3261e;font-weight:900;font-size:14px;min-height:0}.err:empty{display:none}
.namebox{display:flex;gap:8px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;box-shadow:0 5px 0 var(--ink)}
.namebox input{font:inherit;font-weight:900;font-size:20px;border:0;outline:0;background:transparent;width:190px;text-align:center;user-select:text;-webkit-user-select:text}
.feat{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.feat span{background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:99px;padding:2px 12px;font-size:14px;font-weight:900}
.tut{display:flex;gap:14px;align-items:center}.tut .em{font-size:60px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:8px;font-weight:900;cursor:pointer}
.sw2{width:54px;height:30px;border-radius:99px;border:3px solid var(--ink);background:#d4cfe8;position:relative;flex:none}
.sw2::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:.15s}
.toggle.on .sw2{background:var(--grass)}.toggle.on .sw2::after{left:26px}
textarea.code{width:100%;box-sizing:border-box;height:70px;font:12px/1.2 monospace;border:3px solid var(--ink);border-radius:12px;padding:8px;user-select:text;-webkit-user-select:text}


/* ---------- Bible Adventures ---------- */
#advbar{position:absolute;left:50%;top:var(--hudTop,64px);transform:translateX(-50%);width:min(520px,calc(100% - 20px));background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:6px 12px 8px;pointer-events:none;z-index:11}
#advbar .adv-top{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:17px}
#advbar .adv-top b{font-weight:400;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#advObj{font-size:14px;font-weight:800;color:var(--muted);line-height:1.2;margin:2px 0 5px}

/* ---- The Children’s Catechism: number | question | answer ---- */
const QA_RAW=`1|Who made you?|God.
2|What else did God make?|God made all things.
3|Why did God make you and all things?|For his own glory.
4|How can you glorify God?|By loving him and doing what he commands.
5|Why ought you to glorify God?|Because he made me and takes care of me.
6|Are there more gods than one?|There is only one God.
7|In how many persons does this one God exist?|In three persons.
8|What are they?|The Father, the Son, and the Holy Ghost.
9|What is God?|God is a Spirit, and has not a body like men.
10|Where is God?|God is everywhere.
11|Can you see God?|No; I cannot see God, but he always sees me.
12|Does God know all things?|Yes; nothing can be hid from God.
13|Can God do all things?|Yes; God can do all his holy will.
14|Where do you learn how to love and obey God?|In the Bible alone.
15|Who wrote the Bible?|Holy men who were taught by the Holy Spirit.
16|Who were our first parents?|Adam and Eve.
17|Of what were our first parents made?|God made the body of Adam out of the ground, and formed Eve from the body of Adam.
18|What did God give Adam and Eve besides bodies?|He gave them souls that could never die.
19|Have you a soul as well as a body?|Yes; I have a soul that can never die.
20|How do you know that you have a soul?|Because the Bible tells me so.
21|In what condition did God make Adam and Eve?|He made them holy and happy.
22|What is a covenant?|An agreement between two or more persons.
23|What covenant did God make with Adam?|The covenant of works.
24|What was Adam bound to do by the covenant of works?|To obey God perfectly.
25|What did God promise in the covenant of works?|To reward Adam with life if he obeyed him.
26|What did God threaten in the covenant of works?|To punish Adam with death if he disobeyed.
27|Did Adam keep the covenant of works?|No; he sinned against God.
28|What is Sin?|Sin is any want of conformity unto, or transgression of the law of God.
29|What is meant by want of conformity?|Not being or doing what God requires.
30|What is meant by transgression?|Doing what God forbids.
31|What was the sin of our first parents?|Eating the forbidden fruit.
32|Who tempted them to this sin?|The devil tempted Eve, and she gave the fruit to Adam.
33|What befell our first parents when they had sinned?|Instead of being holy and happy, they became sinful and miserable.
34|Did Adam act for himself alone in the covenant of works?|No; he represented all his posterity.
35|What effect had the sin of Adam on all mankind?|All mankind are born in a state of sin and misery.
36|What is that sinful nature which we inherit from Adam called?|Original sin.
37|What does every sin deserve?|The wrath and curse of God.
38|Can any one go to heaven with this sinful nature?|No; our hearts must be changed before we can be fit for heaven.
39|What is a change of heart called?|Regeneration.
40|Who can change a sinner’s heart?|The Holy Spirit alone.
41|Can any one be saved through the covenant of works?|None can be saved through the covenant of works.
42|Why can none be saved through the covenant of works?|Because all have broken it, and are condemned by it.
43|With whom did God the Father make the covenant of grace?|With Christ, his eternal Son.
44|Whom did Christ represent in the covenant of grace?|His elect people.
45|What did Christ undertake in the covenant of grace?|To keep the whole law for his people, and to suffer the punishment due to their sins.
46|Did our Lord Jesus Christ ever commit the least sin?|No; he was holy, harmless, and undefiled.
47|How could the Son of God suffer?|Christ, the Son of God, became man that he might obey and suffer in our nature.
48|What is meant by the Atonement?|Christ’s satisfying divine justice, by his sufferings and death, in the place of sinners.
49|What did God the Father undertake in the covenant of grace?|To justify and sanctify those for whom Christ should die.
50|What is justification?|It is God’s forgiving sinners, and treating them as if they had never sinned.
51|What is sanctification?|It is God’s making sinners holy in heart and conduct.
52|For whom did Christ obey and suffer?|For those whom the Father had given him.
53|What kind of life did Christ live on earth?|A life of poverty and suffering.
54|What kind of death did Christ die?|The painful and shameful death of the cross.
55|Who will be saved?|Only those who repent of sin, believe in Christ, and lead holy lives.
56|What is it to repent?|To be sorry for sin, and to hate and forsake it because it is displeasing to God.
57|What is it to believe or have faith in Christ?|To trust in Christ alone for salvation.
58|Can you repent and believe in Christ by your own power?|No; I can do nothing good without the help of God’s Holy Spirit.
59|How can you get the help of the Holy Spirit?|God has told us that we must pray to him for the Holy Spirit.
60|How long ago is it since Christ died?|More than nineteen hundred years.
61|How were pious persons saved before the coming of Christ?|By believing in a Savior to come.
62|How did they show their faith?|By offering sacrifices on God’s altar.
63|What did these sacrifices represent?|Christ, the Lamb of God, who was to die for sinners.
64|What offices has Christ?|Christ has three offices.
65|What are they?|The offices of a prophet, of a priest, and of a king.
66|How is Christ a prophet?|Because he teaches us the will of God.
67|How is Christ a priest?|Because he died for our sins and pleads with God for us.
68|How is Christ a king?|Because he rules over us and defends us.
69|Why do you need Christ as a prophet?|Because I am ignorant.
70|Why do you need Christ as a priest?|Because I am guilty.
71|Why do you need Christ as a king?|Because I am weak and helpless.
72|How many commandments did God give on Mount Sinai?|Ten commandments.
73|What are the ten commandments sometimes called?|The Decalogue.
74|What do the first four commandments teach?|Our duty to God.
75|What do the last six commandments teach?|Our duty to our fellow men.
76|What is the sum of the ten commandments?|To love God with all my heart, and my neighbor as myself.
77|Who is your neighbor?|All my fellow men are my neighbors.
78|Is God pleased with those who love and obey him?|Yes; he says, “I love them that love me.”
79|Is God displeased with those who do not love and obey him?|Yes; “God is angry with the wicked every day.”
80|What is the first commandment?|The first commandment is, Thou shalt have no other gods before me.
81|What does the first commandment teach us?|To worship God alone.
82|What is the second commandment?|The second commandment is, Thou shalt not make unto thee any graven image, or any likeness of any things that is in heaven above, or that is in the earth beneath, or that is in the water under the earth; thou shalt not bow down thyself to them, nor serve them: for I, the Lord thy God, am a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth generation of them that hate me; and showing mercy unto thousands of them that love me, and keep my commandments.
83|What does the second commandment teach us?|To worship God in a proper manner, and to avoid idolatry.
84|What is the third commandment?|The third commandment is, Thou shalt not take the name of the Lord thy God in vain: for the Lord will not hold him guiltless that taketh his name in vain.
85|What does the third commandment teach me?|To reverence God’s name, word, and works.
86|What is the fourth commandment?|The fourth commandment is, Remember the Sabbath day to keep it holy. Six days shalt thou labor, and do all thy work, but the seventh day is the Sabbath of the Lord thy God; in it thou shalt not do any work, thou, nor thy son, nor thy daughter, nor thy manservant, nor thy maidservant, nor thy cattle, nor thy stranger that is within thy gates: for in six days the Lord made heaven and earth, the sea, and all that in them is, and rested the seventh day; wherefore the Lord blessed the Sabbath Day, and hallowed it.
87|What does the fourth commandment teach us?|To keep the Sabbath holy.
88|What day of the week is the Christian Sabbath?|The first day of the week, called the Lord’s day.

    if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k==="style")e.style.cssText=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v);}
  for(const kid of kids.flat()){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(kid))}
  return e;
}

/* ---------- Save data: one slot per player profile (per browser), also exportable as a code ---------- */

};
function defaults(){return{

function mergeInto(t,s){for(const k in s){if(s[k]&&typeof s[k]==="object"&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==="object")mergeInto(t[k],s[k]);else t[k]=s[k]}return t}

  summary(id,o){let m=0;for(const k in(o.q||{}))if(o.q[k]&&o.q[k].lv>=4)m++;const w=o.wear||{};return{id,name:o.name||"Player",lv:o.lv||1,m,skin:w.skin||"#f1c27d",shirt:w.shirt||"#1e88e5"}},
  load(){

    if(!this.idx.list.length){ // one-time move of the old single save into a profile
      const raw=store.get(LEGACY_KEY);
      if(raw){try{const o=JSON.parse(raw);if(o&&o.v===1){const id=this.newId();store.set(this.key(id),raw);this.idx.list.push(this.summary(id,o));this.idx.last=id;this.write()}}catch(e){}}
    }

const dayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function rollDay(){
  const today=dayKey();
  if(S.lastDay!==today){
    const y=new Date();y.setDate(y.getDate()-1);
    S.streak=(S.lastDay===dayKey(y))?S.streak+1:1;
    S.bestStreak=Math.max(S.bestStreak,S.streak);
    S.lastDay=today;
  }
  if(S.daily.day!==today)S.daily={day:today,n:0,claimed:false};

/* ---------- Mastery (each question has a level 0–4) ---------- */
const ZERO=Object.freeze({lv:0,seen:0,ok:0,miss:0});
const getQ=n=>S.q[n]||ZERO;
const writeQ=n=>S.q[n]||(S.q[n]={lv:0,seen:0,ok:0,miss:0});
const LV_NAMES=["New","Seen","Learning","Strong","Mastered"];
function secStats(id){
  const s=SECTIONS[id-1];let n=0,sum=0,learned=0,lv3=0,mastered=0,seen=0;
  for(let i=s.from;i<=s.to;i++){n++;const q=getQ(i);sum+=q.lv;if(q.seen)seen++;if(q.lv>=2)learned++;if(q.lv>=3)lv3++;if(q.lv>=4)mastered++}
  const pct=sum/(4*n);
  return{n,pct,seen,learned,lv3,mastered,stars:pct>=.85?3:pct>=.5?2:pct>=.12?1:0};
}
function totals(){let seen=0,learned=0,mastered=0;for(const q of QA){const g=getQ(q.n);if(g.seen)seen++;if(g.lv>=2)learned++;if(g.lv>=4)mastered++}return{seen,learned,mastered}}
function itemUnlocked(it){if(it.story)return !!(S.stories[it.story]&&S.stories[it.story].done);return !it.unlock||(secStats(it.unlock).learned/secStats(it.unlock).n>=.7)}
function itemOwned(it){return it.cost===0&&itemUnlocked(it)||!!S.owned[it.id]}

/* pick the questions for one run, favouring ones that need practice */
function pickRun(nums,count){
  const pool=nums.slice(),out=[];let fresh=0;
  while(out.length<count&&pool.length){
    const ws=pool.map(n=>{const q=getQ(n);let w=1+Math.pow(4-q.lv,2)*.6+(q.miss>q.ok?2:0);if(q.lv===0&&q.seen===0)w=fresh>=4?0:8;return w});
    let tot=ws.reduce((a,b)=>a+b,0),i;
    if(tot<=0)i=Math.floor(Math.random()*pool.length);
    else{let r=Math.random()*tot;for(i=0;i<ws.length;i++){r-=ws[i];if(r<=0)break}i=Math.min(i,pool.length-1)}
    const n=pool.splice(i,1)[0];if(getQ(n).seen===0)fresh++;out.push(n);
  }
  return out.sort((a,b)=>a-b);
}

/* ---------- Question → game plan ---------- */
const nwords=s=>s.trim().split(/\s+/).length;
function planFor(n){
  const q=QBY[n],st=getQ(n),lv=st.lv,words=nwords(q.a),mc=!!DIS[n];
  let p;
  if(!mc){ // long “recite it” answers
    if(lv<=1)p={mode:"cloze",blanks:words>40?3:2};
    else if(lv===2)p={mode:"cloze",blanks:words>40?6:3};
    else p={mode:"order"};
  }else if(words<=2)p={mode:"mc",n:lv===0?3:4};
  else if(lv===0)p={mode:"mc",n:3};
  else if(lv===1)p={mode:"mc",n:4};
  else if(lv===2)p=words>=5?{mode:"cloze",blanks:words>=10?2:1}:{mode:"mc",n:4};
  else if(lv===3)p=words>=3?{mode:"order"}:{mode:"mc",n:4};
  else p=words>=6?(Math.random()<.5?{mode:"order"}:{mode:"cloze",blanks:Math.min(4,Math.ceil(words/4))}):{mode:"mc",n:4};
  p.learn=st.seen===0||lv===0;p.words=words;p.n=p.n||0;
  return p;
}
function buildChoices(n,count){
  const q=QBY[n];
  const wrong=shuffle(DIS[n]).slice(0,count-1);
  return shuffle([{t:q.a,ok:true}].concat(wrong.map(t=>({t,ok:false}))));
}

const STOP=new Set("that with from have this they them their which shall will unto thou thee thy upon into were been what when there those these your also than then because before after about such some very does being whom whose himself".split(" "));
const WORD_RE=/^([^A-Za-z’'-]*)([A-Za-z’'-]+)([^]*)$/;
const WORDPOOL=(()=>{const m=new Map();for(const q of QA)for(const t of q.a.split(/\s+/)){const r=WORD_RE.exec(t);if(!r)continue;const c=r[2];if(c.length>=4&&!STOP.has(c.toLowerCase())){const k=c.toLowerCase();if(!m.has(k))m.set(k,{w:c,secs:new Set()});m.get(k).secs.add(q.sec)}}return[...m.values()]})();
function buildCloze(n,blanks){
  const q=QBY[n],toks=q.a.split(/\s+/).map((t,i)=>{const r=WORD_RE.exec(t)||[t,"",t,""];return{i,pre:r[1],core:r[2],suf:r[3],blank:false}});
  const cand=toks.filter(t=>t.core.length>=4&&!STOP.has(t.core.toLowerCase()));
  const chosen=cand.length<=blanks?cand:shuffle(cand).slice(0,blanks);
  chosen.forEach(t=>t.blank=true);
  const have=new Set(toks.map(t=>t.core.toLowerCase()));
  const need=clamp(chosen.length+2,3,Math.max(4,chosen.length+3));
  const answers=chosen.map(t=>t.core);
  const decoys=[];
  const sample=shuffle(WORDPOOL).sort((a,b)=>(b.secs.has(q.sec)?1:0)-(a.secs.has(q.sec)?1:0));
  for(const d of sample){
    if(decoys.length>=need-chosen.length&&decoys.length>=2)break;
    if(have.has(d.w.toLowerCase()))continue;
    const ref=answers[decoys.length%answers.length]||"word";
    if(Math.abs(d.w.length-ref.length)>3)continue;
    const cap=/^[A-Z]/.test(ref);let w=d.w;
    if(cap!==/^[A-Z]/.test(w))w=cap?w[0].toUpperCase()+w.slice(1):w[0].toLowerCase()+w.slice(1);
    if(decoys.includes(w))continue;
    decoys.push(w);
  }
  const chips=shuffle(answers.concat(decoys)).map((w,k)=>({id:k,w}));
  return{toks,chips,order:chosen.map(t=>t.i)};
}
function buildOrder(n){
  const a=QBY[n].a,words=a.split(/\s+/);
  let tiles;
  if(words.length<=9)tiles=words;
  else{
    const ch=[];let cur=[];
    for(const w of words){cur.push(w);if(/[,;:.?!”]$/.test(w)&&cur.length>=2){ch.push(cur);cur=[]}}
    if(cur.length)ch.push(cur);
    tiles=[];
    for(const c of ch){
      if(c.length>6){const parts=Math.ceil(c.length/5),k=Math.ceil(c.length/parts);for(let i=0;i<c.length;i+=k)tiles.push(c.slice(i,i+k).join(" "))}
      else tiles.push(c.join(" "));
    }
  }
  let sh=shuffle(tiles.map((t,i)=>({t,i})));
  if(tiles.length>1)for(let tries=0;tries<6&&sh.every((x,i)=>x.i===i);tries++)sh=shuffle(sh);
  return{tiles,shuffled:sh};
}

/* ---------- XP, coins, levels ---------- */
function recordFaith(qn,first){
  const w=writeQ(qn);w.seen++;S.stats.answers++;S.daily.n++;
  if(first){w.ok++;w.lv=Math.min(4,w.lv+1);S.stats.right++}else{w.miss++;if(w.lv>0)w.lv--}
  const coins=Math.round((first?12:4)*(1+petBonus())),xp=first?10:3;S.coins+=coins;
  return{coins,xp,ups:addXP(xp)};
}
const xpNeed=l=>50+25*(l-1);
function petBonus(){return S.team.reduce((a,id)=>{const p=PETS.find(x=>x.id===id);return a+(p?RARITY[p.r].bonus:0)},0)}
function addXP(n){let up=0;S.xp+=n;while(S.xp>=xpNeed(S.lv)){S.xp-=xpNeed(S.lv);S.lv++;S.eggs++;S.coins+=25;up++}return up}

/* ---------- Badges ---------- */
function checkBadges(){
  const got=[],t=totals(),has=id=>S.badges[id];
  const give=id=>{if(!has(id)){S.badges[id]=Date.now();got.push(BADGES.find(b=>b.id===id))}};
  if(S.stats.runs>=1)give("first_run");
  if(t.learned>=20)give("learn20");
  if(t.mastered>=20)give("master20");
  if(t.mastered>=60)give("master60");
  if(t.mastered>=145)give("master145");
  if(S.stats.bestCombo>=5)give("combo5");
  if(S.stats.bestCombo>=10)give("combo10");
  if(S.stats.perfect>=1)give("flawless");
  if(S.streak>=3)give("streak3");
  if(S.streak>=7)give("streak7");
  if(S.stats.hatches>=1)give("hatch1");
  const kinds=Object.keys(S.pets).length;
  if(kinds>=5)give("pets5");
  if(kinds>=PETS.length)give("pets14");
  if(S.lv>=5)give("lvl5");
  if(S.lv>=10)give("lvl10");
  if(ITEMS.filter(i=>i.unlock).every(i=>itemUnlocked(i)))give("armor");
  const sd=Object.values(S.stories).filter(x=>x.done);
  if(sd.length>=1)give("story1");if(sd.length>=5)give("story5");if(sd.length>=STORIES.length)give("story14");
  if(sd.some(x=>x.stars>=3))give("heart3");
  for(const s of SECTIONS){const st=secStats(s.id);if(st.lv3>=st.n)give("sec"+s.id)}
  return got;
}

/* ---------- Audio (all synthesized, no files) ---------- */
const Snd={
  ctx:null,
  init(){
    if(this.ctx){if(this.ctx.state==="suspended")this.ctx.resume();return}
    try{
      try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
      const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();
      this.master=this.ctx.createGain();this.master.gain.value=.9;this.master.connect(this.ctx.destination);
      this.sfxG=this.ctx.createGain();this.sfxG.connect(this.master);
      this.musG=this.ctx.createGain();this.musG.connect(this.master);this.applyVol();
      const len=this.ctx.sampleRate*.08,buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noise=buf;
    }catch(e){this.ctx=null}
  },
  applyVol(){if(this.ctx)this.musG.gain.value=S.set.music?.55:0},
  t(f,dur,type,vol,slide,delay,dest){
    const c=this.ctx;if(!c)return;const t0=c.currentTime+(delay||0);
    const o=c.createOscillator(),g=c.createGain();o.type=type||"square";
    o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t0+dur);
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.1,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(dest||this.sfxG);o.start(t0);o.stop(t0+dur+.05);
  },
  sfx(name){if(!this.ctx||!S.set.sfx)return;const f=SFX[name];if(f)f(this)},
  /* gentle generative background music */
  mood:"hub",step:0,nextT:0,timer:0,root:0,
  music(mood,root){
    this.mood=mood;this.root=root||0;
    if(!this.ctx||this.timer)return;
    this.nextT=this.ctx.currentTime+.1;this.step=0;
    this.timer=setInterval(()=>this.tick(),100);
  },
  stopMusic(){clearInterval(this.timer);this.timer=0},
  tick(){
    const c=this.ctx;if(!c||!S.set.music)return;
    const bpm=this.mood==="run"?118:92,dur=60/bpm/2;
    while(this.nextT<c.currentTime+.35){this.note(this.step,this.nextT,dur);this.nextT+=dur;this.step++}
  },
  note(step,t,dur){
    const CH=[[0,4,7],[7,11,14],[9,12,16],[5,9,12]],bar=Math.floor(step/8)%4,i=step%8,ch=CH[bar];
    const hz=s=>261.63*Math.pow(2,(s+this.root)/12);
    const play=(f,d,type,vol,delay)=>{
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+(delay||0));g.gain.exponentialRampToValueAtTime(vol,t+(delay||0)+.02);g.gain.exponentialRampToValueAtTime(.0001,t+(delay||0)+d);
      o.connect(g);g.connect(this.musG);o.start(t+(delay||0));o.stop(t+(delay||0)+d+.05);
    };
    const ARP=[0,1,2,1,2,1,2,1];
    play(hz(ch[ARP[i]]+12),dur*2.2,"triangle",.05);
    if(i===0||i===4)play(hz(ch[0]-12),dur*3.5,"sine",.11);
    if(i%2===1&&this.noise){
      const s=this.ctx.createBufferSource(),g=this.ctx.createGain(),f=this.ctx.createBiquadFilter();
      s.buffer=this.noise;f.type="highpass";f.frequency.value=7000;g.gain.setValueAtTime(this.mood==="run"?.05:.025,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);
      s.connect(f);f.connect(g);g.connect(this.musG);s.start(t);
    }
    if(Math.random()<.34){const P=[0,2,4,7,9,12,14,16],n=P[Math.floor(Math.random()*P.length)]+12;play(hz(n),dur*3,"sine",.045,dur*.5)}
  }
};

  for(let i=0;i<pos.count;i++){const y=pos.getY(i)/700,k=Math.pow(clamp((y+.05)/.85,0,1),.8);t.copy(c2).lerp(c1,k);col.setXYZ(i,t.r,t.g,t.b)}
  col.needsUpdate=true;
  scene.fog=new THREE.Fog(c2.getHex(),140,560);
  stars.visible=th.deco==="stars";
  hemi.color.set(th.deco==="stars"?0xc9c4ff:0xffffff);
  hemi.intensity=th.deco==="stars"?.85:.95;
}

/* ---------- Blocky, studded “plastic” materials ---------- */
const TILE=2;
function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
const TEX={};
function initTextures(){
  TEX.top=canvasTex(64,64,(x,w,h)=>{x.fillStyle="#f3f3f3";x.fillRect(0,0,w,h);x.strokeStyle="#d9d9d9";x.lineWidth=3;x.strokeRect(1.5,1.5,w-3,h-3);
    x.fillStyle="#cfcfcf";x.beginPath();x.arc(33,35,15,0,7);x.fill();x.fillStyle="#ffffff";x.beginPath();x.arc(32,32,14,0,7);x.fill();x.fillStyle="#ececec";x.beginPath();x.arc(32,32,9,0,7);x.fill();x.fillStyle="#fafafa";x.beginPath();x.arc(30,30,6,0,7);x.fill()});
  TEX.side=canvasTex(64,64,(x,w,h)=>{x.fillStyle="#f6f6f6";x.fillRect(0,0,w,h);x.strokeStyle="#dcdcdc";x.lineWidth=4;x.strokeRect(2,2,w-4,h-4)});
}
const matCache=new Map(),geoCache=new Map(),lamCache=new Map();
function blockMats(color){
  let m=matCache.get(color);
  if(!m){m=[new THREE.MeshLambertMaterial({color,map:TEX.side}),new THREE.MeshLambertMaterial({color,map:TEX.top})];matCache.set(color,m)}
  return m;
}
function boxGeo(w,h,d){
  const k=w+","+h+","+d;let g=geoCache.get(k);
  if(!g){
    g=new THREE.BoxGeometry(w,h,d);const uv=g.attributes.uv,sc=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
    for(let f=0;f<6;f++)for(let v=0;v<4;v++){const i=f*4+v;uv.setXY(i,uv.getX(i)*sc[f][0]/TILE,uv.getY(i)*sc[f][1]/TILE)}
    // regroup the index: 4 side faces (material 0) then the top (material 1); the unseen bottom is dropped
    const a=g.index.array,n=[];for(let i=0;i<12;i++)n.push(a[i]);for(let i=24;i<36;i++)n.push(a[i]);for(let i=12;i<18;i++)n.push(a[i]);
    g.setIndex(n);g.clearGroups();g.addGroup(0,24,0);g.addGroup(24,6,1);
    g.userData.shared=true;geoCache.set(k,g);

}
/* a studded block whose centre is at (x,y,z) */
function block(w,h,d,color,x=0,y=0,z=0,parent){
  const m=new THREE.Mesh(boxGeo(w,h,d),blockMats(color));m.position.set(x,y,z);m.userData.size=[w,h,d];if(parent)parent.add(m);return m;
}
function lam(color,opacity){
  const k=color+(opacity||"");let m=lamCache.get(k);
  if(!m){m=new THREE.MeshLambertMaterial({color});if(opacity){m.transparent=true;m.opacity=opacity}lamCache.set(k,m)}return m;
}
const UNIT=new THREE.BoxGeometry(1,1,1);UNIT.userData.shared=true;
function pbox(w,h,d,color,x=0,y=0,z=0,parent,opacity){
  const m=new THREE.Mesh(UNIT,lam(color,opacity));m.scale.set(w,h,d);m.position.set(x,y,z);if(parent)parent.add(m);return m;

/* ---------- Batching: merge static meshes that share a material into one draw call ---------- */
const _v=new THREE.Vector3(),_n=new THREE.Vector3(),_nm=new THREE.Matrix3();
function collectInto(buckets,m,matrix){
  const g=m.geometry;if(!g.index||!g.attributes.uv||!g.attributes.normal)return false;
  const mats=Array.isArray(m.material)?m.material:[m.material],groups=g.groups.length?g.groups:[{start:0,count:g.index.count,materialIndex:0}];
  _nm.getNormalMatrix(matrix);
  const pos=g.attributes.position,nor=g.attributes.normal,uv=g.attributes.uv,idx=g.index;
  for(const gr of groups){
    const mat=mats[gr.materialIndex];if(!mat)continue;
    let b=buckets.get(mat);if(!b){b={mat,p:[],n:[],u:[],i:[]};buckets.set(mat,b)}
    const map=new Map();
    for(let k=gr.start;k<gr.start+gr.count;k++){
      const vi=idx.getX(k);let ni=map.get(vi);
      if(ni===undefined){ni=b.p.length/3;map.set(vi,ni);_v.fromBufferAttribute(pos,vi).applyMatrix4(matrix);b.p.push(_v.x,_v.y,_v.z);_n.fromBufferAttribute(nor,vi).applyMatrix3(_nm).normalize();b.n.push(_n.x,_n.y,_n.z);b.u.push(uv.getX(vi),uv.getY(vi))}
      b.i.push(ni);
    }
  }
  return true;
}
function bucketsToMeshes(buckets,parent){
  for(const b of buckets.values()){
    const g=new THREE.BufferGeometry();
    g.setAttribute("position",new THREE.Float32BufferAttribute(b.p,3));g.setAttribute("normal",new THREE.Float32BufferAttribute(b.n,3));g.setAttribute("uv",new THREE.Float32BufferAttribute(b.u,2));
    g.setIndex(b.p.length/3>65535?new THREE.Uint32BufferAttribute(b.i,1):new THREE.Uint16BufferAttribute(b.i,1));
    const m=new THREE.Mesh(g,b.mat);m.userData.merged=true;parent.add(m);
  }
}
const isDynamic=o=>{for(;o;o=o.parent)if(o.userData.dynamic)return true;return false};
function batchWorld(root){
  root.updateMatrixWorld(true);
  const list=[];root.traverse(o=>{if(o.isMesh&&!o.userData.own&&!o.userData.merged&&!isDynamic(o))list.push(o)});
  const buckets=new Map();
  for(const m of list)if(collectInto(buckets,m,m.matrixWorld)&&m.parent)m.parent.remove(m);
  bucketsToMeshes(buckets,root);
}
function mergeGroup(g){
  const buckets=new Map();
  for(const m of g.children.filter(o=>o.isMesh)){m.updateMatrix();if(collectInto(buckets,m,m.matrix))g.remove(m)}
  bucketsToMeshes(buckets,g);
}

/* ---------- Text in the 3D world ---------- */
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrapLines(ctx,text,maxW){
  const words=text.split(" "),lines=[];let line="";
  for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}
  if(line)lines.push(line);return lines;
}
function fitText(ctx,text,maxW,maxH,minF,maxF,weight=800){
  let f=maxF,lines;
  for(;f>=minF;f-=2){ctx.font=weight+" "+f+"px "+CFONT;lines=wrapLines(ctx,text,maxW);if(lines.length*f*1.16<=maxH)break}
  return{f,lines};
}
function labelSprite(text,hgt=2,o={}){
  const size=o.size||64,pad=o.pad||18,c=document.createElement("canvas"),ctx=c.getContext("2d"),lines=String(text).split("\n");
  ctx.font="800 "+size+"px "+CFONT;
  const wd=Math.max(...lines.map(l=>ctx.measureText(l).width));
  c.width=Math.ceil(wd+pad*2+10);c.height=Math.ceil(lines.length*size*1.2+pad*2);
  ctx.font="800 "+size+"px "+CFONT;ctx.textAlign="center";ctx.textBaseline="middle";
  if(o.bg){rr(ctx,2,2,c.width-4,c.height-4,o.radius||26);ctx.fillStyle=o.bg;ctx.fill();if(o.border){ctx.lineWidth=6;ctx.strokeStyle=o.border;ctx.stroke()}}
  lines.forEach((l,i)=>{const y=pad+size*1.2*(i+.5)+2;if(o.stroke){ctx.lineWidth=11;ctx.lineJoin="round";ctx.strokeStyle=o.stroke;ctx.strokeText(l,c.width/2,y)}ctx.fillStyle=o.color||"#fff";ctx.fillText(l,c.width/2,y)});
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,fog:false}));
  sp.scale.set(hgt*c.width/c.height,hgt,1);sp.userData.own=true;return sp;
}
function answerSign(letter,text,color,w,h){
  const cw=600,ch=Math.round(cw*h/w),c=document.createElement("canvas");c.width=cw;c.height=ch;const x=c.getContext("2d");
  rr(x,6,6,cw-12,ch-12,34);x.fillStyle="#ffffff";x.fill();x.lineWidth=12;x.strokeStyle=color;x.stroke();
  const hh=ch*.2;x.save();rr(x,6,6,cw-12,ch-12,34);x.clip();x.fillStyle=color;x.fillRect(0,0,cw,hh+6);x.restore();
  x.fillStyle="#fff";x.font="900 "+Math.round(hh*.82)+"px "+CFONT;x.textAlign="center";x.textBaseline="middle";x.lineWidth=8;x.strokeStyle="rgba(0,0,0,.25)";x.strokeText(letter,cw/2,hh*.55);x.fillText(letter,cw/2,hh*.55);
  const fit=fitText(x,text,cw-70,ch-hh-40,34,72,800),maxL=Math.floor((ch-hh-40)/(fit.f*1.16));
  if(fit.lines.length>maxL){fit.lines=fit.lines.slice(0,maxL);fit.lines[maxL-1]=fit.lines[maxL-1].replace(/\s*\S*$/,"")+"…"}
  x.font="800 "+fit.f+"px "+CFONT;x.fillStyle="#26233a";x.textBaseline="middle";
  const lh=fit.f*1.16,y0=hh+(ch-hh)/2-(fit.lines.length-1)*lh/2;
  fit.lines.forEach((l,i)=>x.fillText(l,cw/2,y0+i*lh));
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;tex.anisotropy=4;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,fog:false}));
  m.rotation.y=Math.PI;m.userData.own=true;return m;
}
function flatLetter(letter,color,size){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  x.fillStyle="rgba(255,255,255,.92)";x.beginPath();x.arc(128,128,112,0,7);x.fill();x.lineWidth=18;x.strokeStyle=color;x.stroke();
  x.fillStyle=color;x.font="900 150px "+CFONT;x.textAlign="center";x.textBaseline="middle";x.fillText(letter,128,138);
  const tex=new THREE.CanvasTexture(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(size,size),new THREE.MeshBasicMaterial({map:tex,transparent:true,fog:false}));

/* ---------- Avatar (Roblox-style blocky character) ---------- */
const faceCache=new Map();
function faceTex(skin,face){
  const k=skin+face;let t=faceCache.get(k);if(t)return t;
  const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");
  x.fillStyle=skin;x.fillRect(0,0,128,128);x.fillStyle=x.strokeStyle="#2a2330";x.lineWidth=7;x.lineCap="round";
  const eyes=()=>{x.beginPath();x.ellipse(40,52,8,12,0,0,7);x.ellipse(88,52,8,12,0,0,7);x.fill()};
  const smile=()=>{x.beginPath();x.arc(64,70,26,.25,Math.PI-.25);x.stroke()};
  switch(face){
    case"grin":eyes();x.fillStyle="#5a1428";x.beginPath();x.moveTo(30,80);x.quadraticCurveTo(64,132,98,80);x.closePath();x.fill();x.fillStyle="#fff";x.fillRect(36,80,56,11);break;
    case"wow":eyes();x.fillStyle="#5a1428";x.beginPath();x.ellipse(64,96,12,16,0,0,7);x.fill();break;
    case"wink":x.beginPath();x.moveTo(30,52);x.lineTo(50,52);x.stroke();x.beginPath();x.ellipse(88,52,8,12,0,0,7);x.fill();smile();break;
    case"silly":eyes();smile();x.fillStyle="#ff6b8a";x.beginPath();x.ellipse(78,98,12,14,0,0,7);x.fill();break;
    case"cool":x.fillStyle="#15131c";x.fillRect(18,40,92,26);x.fillRect(56,44,16,8);x.fillStyle="rgba(255,255,255,.55)";x.fillRect(26,44,16,6);x.fillRect(76,44,16,6);x.strokeStyle="#2a2330";smile();break;
    case"stars":{x.fillStyle="#ffcf30";for(const cx of[40,88]){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?7:17;x.lineTo(cx+Math.cos(a)*r,52+Math.sin(a)*r)}x.closePath();x.fill()}x.strokeStyle="#2a2330";smile();break}
    case"angry":eyes();x.lineWidth=8;x.beginPath();x.moveTo(24,34);x.lineTo(54,46);x.moveTo(104,34);x.lineTo(74,46);x.stroke();x.beginPath();x.arc(64,104,24,Math.PI+.35,-.35);x.stroke();break;
    case"happy":for(const cx of[40,88]){x.beginPath();x.arc(cx,60,11,Math.PI,0);x.stroke()}x.fillStyle="#5a1428";x.beginPath();x.arc(64,78,24,0,Math.PI);x.fill();x.fillStyle="#fff";x.fillRect(46,78,36,6);break;
    case"lashes":eyes();x.lineWidth=4;for(const[cx,d]of[[40,-1],[88,1]]){for(let i=0;i<3;i++){x.beginPath();x.moveTo(cx+d*8,48);x.lineTo(cx+d*(16+i*3),40+i*5);x.stroke()}}x.fillStyle="rgba(255,110,140,.45)";x.beginPath();x.ellipse(22,84,12,8,0,0,7);x.ellipse(106,84,12,8,0,0,7);x.fill();x.strokeStyle="#2a2330";x.lineWidth=7;smile();break;
    case"blush":eyes();x.fillStyle="rgba(255,110,140,.5)";x.beginPath();x.ellipse(22,84,13,9,0,0,7);x.ellipse(106,84,13,9,0,0,7);x.fill();x.strokeStyle="#2a2330";smile();break;
    default:eyes();smile();
  }
  t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;faceCache.set(k,t);return t;
}

function buildAvatar(look){
  const A={root:new THREE.Group()};
  const M={skin:new THREE.MeshLambertMaterial(),shirt:new THREE.MeshLambertMaterial(),pants:new THREE.MeshLambertMaterial(),shoe:new THREE.MeshLambertMaterial(),face:new THREE.MeshLambertMaterial()};
  const body=new THREE.Group();A.root.add(body);A.body=body;

  const mkArm=x=>{const g=new THREE.Group();g.position.set(x,3.9,0);const s=new THREE.Mesh(UNIT,M.shirt);s.scale.set(.94,1.3,.94);s.position.y=-.65;const h=new THREE.Mesh(UNIT,M.skin);h.scale.set(.9,.72,.9);h.position.y=-1.62;g.add(s,h);body.add(g);return g};
  A.armL=mkArm(-1.48);A.armR=mkArm(1.48);
  A.head=new THREE.Group();A.head.position.y=4.75;body.add(A.head);
  const hm=new THREE.Mesh(UNIT,[M.skin,M.skin,M.skin,M.skin,M.face,M.skin]);hm.scale.set(1.5,1.5,1.5);A.head.add(hm);
  A.hatG=new THREE.Group();A.head.add(A.hatG);

  A.offG=new THREE.Group();A.offG.position.set(-.45,-.9,.1);A.armL.add(A.offG);
  A.chestG=new THREE.Group();A.chestG.position.y=3;body.add(A.chestG);
  A.beltG=new THREE.Group();A.beltG.position.y=2.15;body.add(A.beltG);
  A.hairG=new THREE.Group();A.head.add(A.hairG);A.skirtG=new THREE.Group();body.add(A.skirtG);
  const clear=g=>{while(g.children.length)g.remove(g.children[0])};
  A.set=function(l){
    A.look=Object.assign({},l);
    M.skin.color.set(l.skin);M.shirt.color.set(l.shirt);M.pants.color.set(l.pants);M.shoe.color.set(l.boots?"#cfd8dc":"#2d2d38");
    M.face.map=faceTex(l.skin,l.face);M.face.color.set(0xffffff);M.face.needsUpdate=true;
    clear(A.hatG);A.spin=null;if(l.hat&&HATS[l.hat]){const h=HATS[l.hat]();A.hatG.add(h);A.spin=h.userData.spin||null}
    clear(A.heldG);if(l.held&&HELD[l.held])A.heldG.add(HELD[l.held]());
    clear(A.offG);if(l.off&&OFF[l.off])A.offG.add(OFF[l.off]());
    clear(A.chestG);if(l.chest&&CHEST[l.chest])A.chestG.add(CHEST[l.chest]());
    clear(A.beltG);if(l.belt&&BELT[l.belt])A.beltG.add(BELT[l.belt]());
    clear(A.hairG);if(l.hair&&HAIR[l.hair])A.hairG.add(HAIR[l.hair](l.hairc||"#5a3a22"));

  };

}

/* ---------- Player physics (Roblox-ish: snappy, forgiving) ---------- */
const PHY={G:118,JUMP:42,SPEED:17,HW:.8,H:5.4,STEP:.65,FALL:-95};
const P={x:0,y:0,z:0,vx:0,vy:0,vz:0,ground:null,coyote:0,jbuf:0,face:0,speed:0,hFace:0};
const hooks={jump(){},land(){}};
function solidBox(x0,x1,y0,y1,z0,z1,extra){return Object.assign({kind:"box",x0,x1,y0,y1,z0,z1,on:true},extra||{})}
function solidFromMesh(m,extra){const[w,h,d]=m.userData.size,p=m.position;return solidBox(p.x-w/2,p.x+w/2,p.y-h/2,p.y+h/2,p.z-d/2,p.z+d/2,extra)}
function resolveH(solids,axis){
  const hw=PHY.HW,H=PHY.H;
  for(const s of solids){
    if(!s.on||s.kind==="cyl")continue;
    if(P.x+hw<=s.x0||P.x-hw>=s.x1||P.z+hw<=s.z0||P.z-hw>=s.z1)continue;
    if(P.y>=s.y1-.02||P.y+H<=s.y0+.02)continue;
    if(s.y1-P.y<=PHY.STEP&&P.vy<=.5){P.y=s.y1;continue}
    if(axis==="x"){P.x=P.x<(s.x0+s.x1)/2?s.x0-hw:s.x1+hw;P.vx=0}
    else{P.z=P.z<(s.z0+s.z1)/2?s.z0-hw:s.z1+hw;P.vz=0}
  }
}
function resolveV(solids,prevY){
  const hw=PHY.HW,H=PHY.H;
  for(const s of solids){
    if(!s.on)continue;
    if(s.kind==="cyl"){const dx=P.x-s.cx,dz=P.z-s.cz;if(dx*dx+dz*dz>s.r*s.r)continue}
    else if(P.x+hw<=s.x0||P.x-hw>=s.x1||P.z+hw<=s.z0||P.z-hw>=s.z1)continue;
    if(P.vy<=0&&prevY>=s.y1-.15&&P.y<=s.y1){P.y=s.y1;P.vy=0;P.ground=s}
    else if(P.vy>0&&s.kind!=="cyl"&&prevY+H<=s.y0+.05&&P.y+H>s.y0){P.y=s.y0-H;P.vy=0}
  }
}
function physicsStep(dt,mx,mz,jumpPressed,jumpHeld,solids){
  const sp=PHY.SPEED,accel=P.ground?130:75,k=Math.min(1,accel*dt/sp);
  P.vx+=(mx*sp-P.vx)*k;P.vz+=(mz*sp-P.vz)*k;
  P.coyote=P.ground?.11:P.coyote-dt;P.jbuf=jumpPressed?.13:P.jbuf-dt;
  if(P.jbuf>0&&P.coyote>0){P.vy=PHY.JUMP;P.ground=null;P.coyote=0;P.jbuf=0;hooks.jump()}
  else if(jumpHeld&&P.ground&&P.vy<=0){P.vy=PHY.JUMP;P.ground=null;hooks.jump()}
  P.vy=Math.max(PHY.FALL,P.vy-PHY.G*dt);
  if(P.ground&&P.ground.mover){P.x+=P.ground.dx;P.y+=P.ground.dy;P.z+=P.ground.dz}
  P.x+=P.vx*dt;resolveH(solids,"x");
  P.z+=P.vz*dt;resolveH(solids,"z");
  const prevY=P.y,was=P.ground;P.ground=null;P.y+=P.vy*dt;resolveV(solids,prevY);
  if(P.ground&&!was&&P.vy===0)hooks.land(P.ground);
  P.speed=Math.hypot(P.vx,P.vz);
}

const Cam={yaw:Math.PI,pitch:.42,dist:19,tx:0,ty:0,tz:0,min:8,max:40,orbit:false,xs:1,shake:0};
function camSnap(){Cam.tx=P.x*Cam.xs;Cam.ty=P.y+3.4;Cam.tz=P.z;camPlace()}
function camPlace(){
  const cp=Math.cos(Cam.pitch);
  camera.position.set(Cam.tx-Math.sin(Cam.yaw)*cp*Cam.dist,Cam.ty+Math.sin(Cam.pitch)*Cam.dist,Cam.tz-Math.cos(Cam.yaw)*cp*Cam.dist);
  if(Cam.shake>.001){camera.position.x+=(Math.random()-.5)*Cam.shake;camera.position.y+=(Math.random()-.5)*Cam.shake}
  camera.lookAt(Cam.tx,Cam.ty,Cam.tz);
  sky.position.copy(camera.position);stars.position.copy(camera.position);
}
function camUpdate(dt){
  const k=Math.min(1,dt*12);
  Cam.tx=lerp(Cam.tx,P.x*Cam.xs,k);Cam.tz=lerp(Cam.tz,P.z,k);Cam.ty=lerp(Cam.ty,P.y+3.4,Math.min(1,dt*7));
  camPlace();
}

/* ---------- Input: keyboard, mouse drag, touch joystick (kits can take over taps and swipes) ---------- */
const Input={keys:{},jumpQ:false,actQ:false,jumpHeld:false,joy:{x:0,y:0},touch:false,drag:null,joyId:null,enabled:true,
  kit:null,tapQ:0,upQ:0,pressQ:[],swipeQ:[],fireQ:[],ptr:{x:0,y:0,down:false,sx:0,sy:0}};
const typing=t=>t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable);
window.addEventListener("keydown",e=>{
  if(typing(e.target))return;
  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)&&Input.enabled)e.preventDefault();
  Input.keys[e.code]=true;
  if(!e.repeat)Input.pressQ.push(e.code);
  if(e.code==="Space"){if(!e.repeat)Input.jumpQ=true;Input.jumpHeld=true}
  if((e.code==="KeyE"||e.code==="Enter")&&!e.repeat)Input.actQ=true;
});
window.addEventListener("keyup",e=>{Input.keys[e.code]=false;if(e.code==="Space")Input.jumpHeld=false});
window.addEventListener("blur",()=>{Input.keys={};Input.jumpHeld=false;Input.joy.x=Input.joy.y=0});
function moveVec(){
  let f=0,r=0;const K=Input.keys;
  if(K.KeyW||K.ArrowUp)f+=1;if(K.KeyS||K.ArrowDown)f-=1;if(K.KeyD||K.ArrowRight)r+=1;if(K.KeyA||K.ArrowLeft)r-=1;
  f+=Input.joy.y;r+=Input.joy.x;
  const m=Math.hypot(f,r);if(m>1){f/=m;r/=m}
  const s=Math.sin(Cam.yaw),c=Math.cos(Cam.yaw);
  return{x:f*s-r*c,z:f*c+r*s,mag:Math.min(1,m)};
}
function resetInputQueues(){Input.tapQ=0;Input.upQ=0;Input.pressQ.length=0;Input.swipeQ.length=0;Input.fireQ.length=0;Input.jumpQ=false}
function initInput(){
  document.addEventListener("gesturestart",e=>e.preventDefault());
  const joyEl=document.getElementById("joy"),knob=document.getElementById("joyKnob");
  canvas.addEventListener("contextmenu",e=>e.preventDefault());
  canvas.addEventListener("pointerdown",e=>{
    if(!Input.enabled)return;
    if(e.pointerType==="touch"){Input.touch=true;document.body.classList.add("touch")}
    try{canvas.setPointerCapture(e.pointerId)}catch(err){}
    Input.ptr={x:e.clientX,y:e.clientY,down:true,sx:e.clientX,sy:e.clientY};Input.tapQ++;
    const arena=Input.kit==="arena";
    /* action arenas: the left side of a touch screen is the joystick, anywhere else is "fire / attack here" */
    if(arena&&!(e.pointerType==="touch"&&e.clientX<appEl.getBoundingClientRect().left+appEl.clientWidth*.38)){Input.fireQ.push({x:e.clientX,y:e.clientY});return}
    if(Input.kit&&!arena)return;
    const left=e.clientX<appEl.getBoundingClientRect().left+appEl.clientWidth*.45;
    if(e.pointerType==="touch"&&left&&Input.joyId===null){
      Input.joyId=e.pointerId;Input.joyO={x:e.clientX,y:e.clientY};
      const r=appEl.getBoundingClientRect();joyEl.style.left=(e.clientX-r.left)+"px";joyEl.style.top=(e.clientY-r.top)+"px";joyEl.classList.add("on");knob.style.transform="translate(-50%,-50%)";
    }else if(!Input.drag){Input.drag={id:e.pointerId,x:e.clientX,y:e.clientY}}
  });
  canvas.addEventListener("pointermove",e=>{
    Input.ptr.x=e.clientX;Input.ptr.y=e.clientY;
    if(Input.kit==="runner"&&Input.ptr.down){ // swipes are read while the finger moves, so lane changes feel instant
      const dx=e.clientX-Input.ptr.sx,dy=e.clientY-Input.ptr.sy;
      if(Math.abs(dx)>34&&Math.abs(dx)>Math.abs(dy)){Input.swipeQ.push(dx<0?"L":"R");Input.ptr.sx=e.clientX;Input.ptr.sy=e.clientY;Input.ptr.swiped=true}
      else if(dy<-44&&!Input.ptr.swiped){Input.swipeQ.push("U");Input.ptr.swiped=true}
    }
    if(Input.kit&&Input.kit!=="arena")return;
    if(Input.joyId===e.pointerId){
      let dx=e.clientX-Input.joyO.x,dy=e.clientY-Input.joyO.y;const R=52,m=Math.hypot(dx,dy);if(m>R){dx=dx/m*R;dy=dy/m*R}
      knob.style.transform="translate(calc(-50% + "+dx+"px),calc(-50% + "+dy+"px))";
      const dz=.18,nx=dx/R,ny=-dy/R,mm=Math.hypot(nx,ny);
      if(mm<dz){Input.joy.x=Input.joy.y=0}else{Input.joy.x=nx;Input.joy.y=ny}
    }else if(Input.drag&&Input.drag.id===e.pointerId){

    }
  });
  const up=e=>{
    if(Input.ptr.down){
      Input.ptr.down=false;Input.upQ++;
      if(Input.kit==="runner"&&!Input.ptr.swiped)Input.swipeQ.push("U"); // a plain tap jumps
    }
    if(Input.joyId===e.pointerId){Input.joyId=null;Input.joy.x=Input.joy.y=0;joyEl.classList.remove("on")}
    if(Input.drag&&Input.drag.id===e.pointerId)Input.drag=null;
  };
  canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
  canvas.addEventListener("wheel",e=>{if(!Input.enabled||Input.kit)return;e.preventDefault();Cam.dist=clamp(Cam.dist+e.deltaY*.02,Cam.min,Cam.max)},{passive:false});

  jb.addEventListener("pointerdown",e=>{e.preventDefault();Input.touch=true;document.body.classList.add("touch");Input.jumpQ=true;Input.jumpHeld=true;jb.classList.add("down");try{jb.setPointerCapture(e.pointerId)}catch(err){}});

  jb.addEventListener("pointerup",jup);jb.addEventListener("pointercancel",jup);
  if(window.matchMedia&&matchMedia("(pointer:coarse)").matches){Input.touch=true;document.body.classList.add("touch")}
}

Adv.K.rhythm={
  input:"rhythm",
  build(story,adv){
    const cfg=story.cfg,W=newWorld(story.theme),beat=60/cfg.bpm;
    W.spawn={x:0,y:.05,z:0,yaw:0};
    const rh=adv.rh={beat,A:Math.max(1.1,beat*2),now:-beat*3,notes:[],barT:0,pat:BAR_PATTERNS[0],bar:0,bi:0,score:0,goal:cfg.goal,combo:0,best:0,perfect:0,good:0,miss:0,hold:false,fin:false,finT:0,gi:0,pops:[],beatN:-1,color:story.color,
      win:{perf:.075+adv.boost*.012,good:.15+adv.boost*.02},total:0,ask:false,gates:story.linked.length>1?[.34,.68]:[.5]};
    rh.dio=RH_DIO[cfg.dio](W,adv);batchWorld(W.group);
    return W;
  },
  start(adv){
    const rh=adv.rh;$("rhythm").hidden=false;AH.count("🎵 0");rh.dio.start&&rh.dio.start(adv);
    G.camCustom=dt=>rh.dio.cam(dt,rh);
  },
  cleanup(adv){$("rhythm").hidden=true;G.camCustom=null;G.avatar.set(S.wear)},
  update(dt,adv,paused){
    const rh=adv.rh;
    if(!paused){
      rh.now+=dt;adv.t+=dt;
      let taps=Input.tapQ+(Input.jumpQ?1:0);Input.tapQ=0;Input.jumpQ=false;Input.pressQ.length=0;Input.swipeQ.length=0;
      // spawn notes (bar by bar, from a few patterns)
      while(!rh.hold&&!rh.fin){
        const t=rh.barT+rh.pat[rh.bi]*rh.beat;
        if(t>rh.now+rh.A+.2)break;
        rh.notes.push({t,j:0,fade:0,played:false});rh.total++;rh.bi++;
        if(rh.bi>=rh.pat.length){rh.bi=0;rh.bar++;rh.barT+=4*rh.beat;rh.pat=BAR_PATTERNS[rh.bar<3?0:Math.floor(Math.random()*BAR_PATTERNS.length)]}
      }
      // taps
      for(;taps>0;taps--){
        let best=null,bd=9;for(const n of rh.notes){if(n.j)continue;const d=Math.abs(n.t-rh.now);if(d<bd&&d<=rh.win.good){best=n;bd=d}}
        if(best){const pf=bd<=rh.win.perf;best.j=pf?"perfect":"good";best.fade=.35;rh.combo++;rh.best=Math.max(rh.best,rh.combo);if(pf)rh.perfect++;else rh.good++;rh.score+=pf?2:1;
          rh.pops.push({t:pf?"PERFECT!":"Good",c:pf?"#ffd43b":"#7be0a0",age:0});Snd.sfx(pf?"tile":"pop");rh.dio.hit&&rh.dio.hit(pf,rh,adv)}
      }
      for(const n of rh.notes){
        if(!n.played&&rh.now>=n.t){n.played=true;Snd.sfx("drum")}
        if(!n.j&&rh.now>n.t+rh.win.good){n.j="miss";n.fade=.25;rh.combo=0;rh.miss++;rh.pops.push({t:"miss",c:"#cfc9e6",age:0})}
        if(n.fade>0)n.fade-=dt;
      }
      while(rh.notes.length>14&&rh.notes[0].j&&rh.notes[0].fade<=0)rh.notes.shift();
      const prog=clamp(rh.score/rh.goal,0,1);AH.prog(prog);AH.count("🎵 "+rh.combo+(rh.combo>=5?" 🔥":""));
      // faith gates pause the music
      if(!rh.fin&&rh.gi<rh.gates.length&&prog>=rh.gates[rh.gi]&&!rh.hold){rh.hold=true}
      if(rh.hold&&!rh.ask&&!rh.fin&&rh.notes.every(n=>n.j&&n.fade<=0)){
        rh.ask=true;const qn=adv.story.linked[rh.gi%adv.story.linked.length];rh.gi++;
        askFaith(qn,()=>{rh.hold=false;rh.ask=false;rh.barT=rh.now+rh.A*.9;rh.bi=0;rh.pat=BAR_PATTERNS[0];rh.notes.length=0;rh.dio.gate&&rh.dio.gate(rh,adv)});
      }
      if(!rh.fin&&(prog>=1||rh.now>170)&&!rh.ask){rh.fin=true;rh.finT=0;hideGateQ();rh.dio.finale&&rh.dio.finale(rh,adv)}
      if(rh.fin){rh.finT+=dt;if(rh.finT>3.4&&!adv.done){const tot=rh.perfect+rh.good+rh.miss,acc=tot?(rh.perfect*2+rh.good)/(2*tot):1;Adv.complete(clamp(acc*1.15,0,1))}}
      for(const p of rh.pops)p.age+=dt;rh.pops=rh.pops.filter(p=>p.age<.8);
      rh.dio.update&&rh.dio.update(dt,rh,adv);
    }
    rhDraw(adv);
  }
};
function rhDraw(adv){
  const rh=adv.rh,cv=$("rhythm"),w=appEl.clientWidth,h=appEl.clientHeight;
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  const x=cv.getContext("2d");x.clearRect(0,0,w,h);
  const cx=w/2,R=Math.max(36,Math.min(w,h)*.085),cy=Math.min(h*.8,h-R*2.2),ph=((rh.now/rh.beat)%1+1)%1,pulse=Math.max(0,1-ph*3.2);
  x.fillStyle="rgba(255,255,255,"+(.14+pulse*.18)+")";x.beginPath();x.arc(cx,cy,R*(1.06+pulse*.2),0,7);x.fill();
  x.lineWidth=8;x.strokeStyle="#fff";x.beginPath();x.arc(cx,cy,R,0,7);x.stroke();
  x.lineWidth=3;x.strokeStyle="rgba(36,31,69,.7)";x.beginPath();x.arc(cx,cy,R+5,0,7);x.stroke();
  for(const n of rh.notes){
    const p=(n.t-rh.now)/rh.A;
    if(n.j){if(n.fade>0&&n.j!=="miss"){x.globalAlpha=n.fade/.35;x.lineWidth=6;x.strokeStyle=n.j==="perfect"?"#ffd43b":"#7be0a0";x.beginPath();x.arc(cx,cy,R*(1+(1-n.fade/.35)*.9),0,7);x.stroke();x.globalAlpha=1}continue}
    if(p>1.02||p<-.3)continue;const r=R*(1+Math.max(0,p)*2.7);
    x.globalAlpha=clamp(1.3-p*.55,.3,1);x.lineWidth=9;x.strokeStyle="#241f45";x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();
    x.lineWidth=6;x.strokeStyle=rh.color;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();x.globalAlpha=1;
  }
  x.textAlign="center";x.font="900 "+Math.round(R*.5)+"px "+CFONT;x.lineJoin="round";
  for(const pp of rh.pops){x.globalAlpha=1-pp.age/.8;x.lineWidth=7;x.strokeStyle="#241f45";x.strokeText(pp.t,cx,cy-R*1.6-pp.age*46);x.fillStyle=pp.c;x.fillText(pp.t,cx,cy-R*1.6-pp.age*46);x.globalAlpha=1}
  if(rh.combo>=3){x.font="900 "+Math.round(R*.42)+"px "+CFONT;x.lineWidth=6;x.strokeStyle="#241f45";x.strokeText("Combo x"+rh.combo,cx,cy+R*1.75);x.fillStyle="#fff";x.fillText("Combo x"+rh.combo,cx,cy+R*1.75)}
  if(rh.now<rh.A*.8){x.font="900 "+Math.round(R*.4)+"px "+CFONT;x.lineWidth=6;x.strokeStyle="#241f45";const t="Tap when the ring fills the circle!";x.strokeText(t,cx,cy-R*2.6);x.fillStyle="#fff";x.fillText(t,cx,cy-R*2.6)}
}

const AR={circ:new THREE.CircleGeometry(1,40),plane:new THREE.PlaneGeometry(1,1),ring:new THREE.RingGeometry(.84,1,56),rock:new THREE.IcosahedronGeometry(1,0),box:new THREE.BoxGeometry(1,1,1)};

const Arena={
  /* begin an action fight: free movement + tap-to-aim input, hearts, no effects yet */
  start(adv,hearts){
    adv.fx=[];adv.hp=adv.maxHp=hearts;adv.inv=0;adv.kb=null;adv.downs=0;adv.hits=0;
    AH.hearts(adv.hp,adv.maxHp);Input.kit="arena";resetInputQueues();Cam.yaw=0;document.body.classList.add("arena");
  },
  stop(){Input.kit=null;resetInputQueues();document.body.classList.remove("arena");if(G.avatar)G.avatar.root.visible=true},
  flat(geo,col,op){
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,depthWrite:false}));
    m.rotation.x=-Math.PI/2;m.position.y=.1;m.userData.dynamic=true;G.W.group.add(m);return m;
  },
  kill(f){f.dead=true;for(const m of f.ms){if(m.parent)m.parent.remove(m);if(m.material)m.material.dispose()}},
  clear(adv){for(const f of adv.fx)Arena.kill(f);adv.fx.length=0},
  /* run fn after t seconds (pauses with the game) */
  delay(adv,t,fn){adv.fx.push({k:"timer",t:0,d:t,fn,ms:[]})},
  near(x,z,r){return Math.hypot(P.x-x,P.z-z)<r+.8&&P.y<3.2},

  /* a red disc that fills up, then boom(f). o.rock drops a boulder on it. */
  ring(adv,x,z,r,delay,boom,o={}){
    const col=o.col||"#ff3b30",base=Arena.flat(AR.circ,col,.22),fill=Arena.flat(AR.circ,col,.5);
    base.position.x=fill.position.x=x;base.position.z=fill.position.z=z;base.scale.set(r,r,1);fill.scale.set(.05,.05,1);
    const f={k:"ring",t:0,d:delay,x,z,r,boom,ms:[base,fill],base,fill};
    if(o.rock){const rk=new THREE.Mesh(AR.rock,new THREE.MeshLambertMaterial({color:"#8d7b68"}));rk.scale.setScalar(Math.max(2,r*.5));rk.userData.dynamic=true;rk.position.set(x,60,z);G.W.group.add(rk);f.rock=rk;f.ms.push(rk)}
    adv.fx.push(f);return f;
  },
  /* a red strip from (x0,z0) along (ux,uz) that fills up, then boom(f) */
  line(adv,x0,z0,ux,uz,L,w,delay,boom){
    const base=Arena.flat(AR.plane,"#ff3b30",.2),fill=Arena.flat(AR.plane,"#ff3b30",.5),rot=Math.atan2(-ux,-uz);
    base.rotation.z=fill.rotation.z=rot;base.position.set(x0+ux*L/2,.1,z0+uz*L/2);base.scale.set(w,L,1);fill.scale.set(w,.05,1);fill.position.set(x0,.11,z0);
    const f={k:"line",t:0,d:delay,x0,z0,ux,uz,L,w,boom,ms:[base,fill],base,fill};adv.fx.push(f);return f;
  },
  /* a thrown spear that flies along (ux,uz) and hurts whoever is in its path (jump over it too!) */
  spear(adv,x0,z0,ux,uz,range,speed=64){
    const shaft=new THREE.Mesh(AR.box,new THREE.MeshLambertMaterial({color:"#8d6e63"})),tip=new THREE.Mesh(AR.box,new THREE.MeshLambertMaterial({color:"#cfd8dc"}));
    shaft.scale.set(.5,.5,10);tip.scale.set(.9,.9,1.8);tip.position.z=.55;shaft.add(tip);shaft.position.set(x0,2.6,z0);shaft.rotation.y=Math.atan2(ux,uz);shaft.userData.dynamic=true;G.W.group.add(shaft);
    const f={k:"spear",x:x0,z:z0,ux,uz,go:0,range,speed,ms:[shaft,tip],m:shaft,hit:false};adv.fx.push(f);Snd.sfx("whoosh");return f;
  },
  /* a ring of shaking ground rushing outward: jump over it! */
  wave(adv,x,z,speed=26,maxR=80){
    const m=Arena.flat(AR.ring,"#ffb300",.75);m.position.set(x,.12,z);m.scale.set(2,2,1);
    const f={k:"wave",R:2,x,z,speed,maxR,ms:[m],m,hit:false};adv.fx.push(f);return f;
  },
  boomFx(x,z,r,col){Part.burst(x,1.2,z,col||["#c8a97a","#ffffff","#8d7b68"],Math.round(10+r*2.6),14,.7,18,1.2);Snd.sfx("whack");Cam.shake=Math.max(Cam.shake,.8)},

  /* a hit on the player: lose a heart, brief invincibility, knocked back. Returns true if it landed. */
  hurt(adv,sx,sz,amt=1){
    if(adv.inv>0||adv.over||adv.done)return false;
    adv.hp-=amt;adv.inv=1.5;adv.hits++;Cam.shake=Math.max(Cam.shake,.9);flash("red",170);Snd.sfx("bad");
    const dx=P.x-sx,dz=P.z-sz,m=Math.hypot(dx,dz)||1;adv.kb={vx:dx/m*26,vz:dz/m*26,t:.22};
    Part.burst(P.x,P.y+3,P.z,["#ffffff","#ff8a80"],12,10,.5,16,.9);popText("Ouch!","bad");
    AH.hearts(Math.max(0,adv.hp),adv.maxHp);
    if(adv.hp<=0)Arena.down(adv);
    return true;
  },
  /* out of hearts: you are knocked down but get right back up, so nobody is stuck */
  down(adv){
    adv.downs++;adv.hp=adv.maxHp;adv.inv=2.6;Arena.clear(adv);AH.hearts(adv.hp,adv.maxHp);
    toast("Knocked down! Get back up and keep going! 💪","gold",2600);Snd.sfx("level");
    if(adv.onDown)adv.onDown();
  },
  heal(adv,n=99){adv.hp=Math.min(adv.maxHp,adv.hp+n);AH.hearts(adv.hp,adv.maxHp)},

  /* per-frame: timers, knock-back, blinking, every warning / spear / wave */
  update(adv,dt){
    adv.inv=Math.max(0,adv.inv-dt);
    if(adv.kb){adv.kb.t-=dt;P.x+=adv.kb.vx*dt;P.z+=adv.kb.vz*dt;if(adv.kb.t<=0)adv.kb=null}
    G.avatar.root.visible=adv.inv<=0||Math.floor(G.t*16)%2===0;
    for(const f of adv.fx.slice()){
      if(f.dead)continue;let done=false;
      if(f.k==="timer"){f.t+=dt;if(f.t>=f.d){done=true;f.fn()}}
      else if(f.k==="ring"){
        f.t+=dt;const k=clamp(f.t/f.d,0,1),pulse=.5+.25*Math.sin(f.t*20);
        f.fill.scale.set(f.r*k,f.r*k,1);f.fill.material.opacity=pulse;
        if(f.rock){f.rock.position.y=lerp(60,1.6,k*k);f.rock.rotation.x+=dt*4;f.rock.rotation.z+=dt*3}
        if(f.t>=f.d){done=true;f.boom(f)}
      }else if(f.k==="line"){
        f.t+=dt;const k=clamp(f.t/f.d,0,1);f.fill.scale.set(f.w,Math.max(.05,f.L*k),1);
        f.fill.position.set(f.x0+f.ux*f.L*k/2,.11,f.z0+f.uz*f.L*k/2);f.fill.material.opacity=.4+.25*Math.sin(f.t*22);
        if(f.t>=f.d){done=true;f.boom(f)}
      }else if(f.k==="spear"){
        const s=f.speed*dt;f.go+=s;f.x+=f.ux*s;f.z+=f.uz*s;f.m.position.x=f.x;f.m.position.z=f.z;
        // distance from the player to the spear's body
        const px=P.x-f.x,pz=P.z-f.z,along=px*f.ux+pz*f.uz,side=Math.abs(px*f.uz-pz*f.ux);
        if(!f.hit&&side<2.1&&Math.abs(along)<5&&P.y<3.4){f.hit=Arena.hurt(adv,f.x-f.ux*4,f.z-f.uz*4)}
        if(f.go>f.range)done=true;
      }else if(f.k==="wave"){
        f.R+=f.speed*dt;f.m.scale.set(f.R,f.R,1);f.m.material.opacity=clamp(1-f.R/f.maxR,.15,.8);
        const d=Math.hypot(P.x-f.x,P.z-f.z),th=Math.max(1.6,f.R*.08+.8);
        if(!f.hit&&Math.abs(d-f.R)<th&&P.y<2.2){f.hit=Arena.hurt(adv,f.x,f.z)}
        if(f.R>f.maxR)done=true;
      }
      else if(f.k==="swish"){f.t+=dt;const k=f.t/.22;f.m.scale.set(f.R*k,f.R*k,1);f.m.material.opacity=.85*(1-k);if(f.t>.22)done=true}
      if(done){Arena.kill(f)}
    }
    adv.fx=adv.fx.filter(f=>!f.dead);
  }
};

/* banners that sit under the top bar (question banner, adventure bar) follow its real height, which varies with screen width */
function fitHudTop(){
  const a=$("topRight").getBoundingClientRect(),b=$("pcard").getBoundingClientRect(),root=$("app").getBoundingClientRect();
  if(a.height<2)return;
  $("hud").style.setProperty("--hudTop",Math.ceil(Math.max(a.bottom,b.bottom)-root.top+5)+"px");

window.addEventListener("resize",()=>setTimeout(fitHudTop,60));window.addEventListener("orientationchange",()=>setTimeout(fitHudTop,300));
function setMode(m){G.mode=m;["title","hub","run","adv"].forEach(x=>document.body.classList.toggle("mode-"+x,x===m));fitHudTop()}
function withFade(fn){
